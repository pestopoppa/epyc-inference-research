- id: real_suite_v1_0008
  tier: 3
  prompt: "This simple HTTP router has a bug: parameterized routes like\n`/users/:id`\
    \ don't extract the parameter value correctly, and\nroute priority is wrong (static\
    \ routes should match before parametric).\n\n```python\nclass Router:\n    def\
    \ __init__(self):\n        self.routes = []\n\n    def add_route(self, method,\
    \ path, handler):\n        parts = path.strip('/').split('/')\n        self.routes.append((method,\
    \ parts, handler))\n\n    def match(self, method, path):\n        \"\"\"Return\
    \ (handler, params) or (None, {}).\"\"\"\n        parts = path.strip('/').split('/')\n\
    \        for route_method, route_parts, handler in self.routes:\n            if\
    \ route_method != method:\n                continue\n            if len(route_parts)\
    \ != len(parts):\n                continue\n            params = {}\n        \
    \    match = True\n            for rp, pp in zip(route_parts, parts):\n      \
    \          if rp.startswith(':'):\n                    params[rp[1:]] = pp\n \
    \               elif rp != pp:\n                    match = False\n          \
    \          break\n            if match:\n                return handler, params\n\
    \        return None, {}\n```\n\nBug: routes are matched in insertion order, so\
    \ if a parametric route\nis added before a static route, the parametric route\
    \ wins. Fix this\nby sorting: static routes first, then parametric."
  expected: ''
  scoring_method: code_execution
  scoring_config:
    language: python
    timeout: 10
    test_code: 'r = Router()

      r.add_route("GET", "/users/:id", lambda: "user_by_id")

      r.add_route("GET", "/users/me", lambda: "current_user")

      r.add_route("POST", "/users", lambda: "create_user")

      # Static route should win over parametric

      handler, params = r.match("GET", "/users/me")

      assert handler() == "current_user", f"Got {handler()}"

      assert params == {}

      # Parametric route extracts param

      handler, params = r.match("GET", "/users/123")

      assert handler() == "user_by_id"

      assert params == {"id": "123"}

      # Method matching

      handler, params = r.match("POST", "/users")

      assert handler() == "create_user"

      # No match

      handler, params = r.match("DELETE", "/users")

      assert handler is None

      handler, params = r.match("GET", "/other")

      assert handler is None

      print("All tests passed!")

      '

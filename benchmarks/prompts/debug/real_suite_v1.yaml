    \[\[0,0,4\],\[0,0,4\],\[-2,-2,2\]\] **Explanation:** - diff\[0\]\[0\] = `onesRow0
    + onesCol0 - zerosRow0 - zerosCol0` = 2 + 1 - 1 - 2 = 0 - diff\[0\]\[1\] = `onesRow0
    + onesCol1 - zerosRow0 - zerosCol1` = 2 + 1 - 1 - 2 = 0 - diff\[0\]\[2\] = `onesRow0
    + onesCol2 - zerosRow0 - zerosCol2` = 2 + 3 - 1 - 0 = 4 - diff\[1\]\[0\] = `onesRow1
    + onesCol0 - zerosRow1 - zerosCol0` = 2 + 1 - 1 - 2 = 0 - diff\[1\]\[1\] = `onesRow1
    + onesCol1 - zerosRow1 - zerosCol1` = 2 + 1 - 1 - 2 = 0 - diff\[1\]\[2\] = `onesRow1
    + onesCol2 - zerosRow1 - zerosCol2` = 2 + 3 - 1 - 0 = 4 - diff\[2\]\[0\] = `onesRow2
    + onesCol0 - zerosRow2 - zerosCol0` = 1 + 1 - 2 - 2 = -2 - diff\[2\]\[1\] = `onesRow2
    + onesCol1 - zerosRow2 - zerosCol1` = 1 + 1 - 2 - 2 = -2 - diff\[2\]\[2\] = `onesRow2
    + onesCol2 - zerosRow2 - zerosCol2` = 1 + 3 - 2 - 0 = 2 **Example 2:** **Input:**
    grid = \[\[1,1,1\],\[1,1,1\]\] **Output:** \[\[5,5,5\],\[5,5,5\]\] **Explanation:**
    - diff\[0\]\[0\] = onesRow0 + onesCol0 - zerosRow0 - zerosCol0 = 3 + 2 - 0 - 0

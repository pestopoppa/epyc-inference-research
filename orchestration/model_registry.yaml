# =============================================================================
# Worker Pool Configuration (Heterogeneous parallel workers)
# =============================================================================
worker_pool:
  # ============================================================================
  # DEPRECATED 2026-05-06 — config dormant; not invoked by production stack.
  # ============================================================================
  # The heterogeneous worker pool was a 2025-Q4 / 2026-Q1 design predating the
  # 2026-03-19 worker_general consolidation onto Qwen3-Coder-30B-A3B Q4 (NUMA
  # 4×48t). It is no longer matched to the production stack.
  #
  # Three independent reasons for deprecation:
  #
  # 1. GGUF FILES NOT ON DISK. The two HOT workers reference paths that do not
  #    exist:
  #      - explore: Qwen/Qwen2.5-7B-Instruct-GGUF/Qwen2.5-7B-Instruct-Q4_K_M.gguf
  #      - code:    Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
  #    The WARM worker references Qwen2.5-Coder-1.5B-Instruct-Q8_0.gguf which is
  #    also not on disk (only Q4_K_M and Q2_K of that family are available, in
  #    QuantFactory/, not the path the registry references). If anyone enabled
  #    this config, all 3 workers would fail with ENOENT at launch.
  #
  # 2. CANONICAL-RECIPE QUALITY DATA IS DECISIVE. From benchmarks/results/
  #    reviews/summary.csv (May-2/4 sweep):
  #      - explore proxy (Qwen2.5-7B Q4_K_S):    27/61 (44%) — −40pp vs worker_general
  #      - code    (Qwen2.5-Coder-7B Q4):        UNTESTED (file missing)
  #      - fast proxy (Qwen2.5-Coder-1.5B Q4_K_M): 4/20 (20%) on partial — −64pp+
  #      - worker_general (Qwen3-Coder-30B-A3B Q4): 153/183 (84%) on full battery
  #    Even the most generous estimate for Qwen2.5-Coder-7B (~60%) loses to
  #    worker_general by ≥24pp on quality.
  #
  # 3. WORKER_GENERAL ALREADY SERVES THE PARALLEL-WORK USE CASE. NUMA 4×48t
  #    deployment provides 4-way concurrency at ~156 t/s aggregate
  #    (4 instances × 43.4 t/s). Sufficient for production worker traffic.
  #    `fast`'s theoretical 4-slot 340 t/s aggregate (at 20% quality) is not a
  #    real win.
  #
  # CODE STATUS: src/services/worker_pool.py is RETAINED as dormant
  # infrastructure. It is gated by use_worker_pool=False default in
  # src/llm_primitives/primitives.py. No code changes — only this config flip.
  # If a future use case emerges (different small models, GPU tiering, etc.)
  # the WorkerPoolManager can be revived by re-enabling here and adding active
  # GGUFs.
  #
  # ============================================================================
  enabled: false  # was true; deprecated 2026-05-06
  description: "DEPRECATED 2026-05-06 — superseded by worker_general (Qwen3-Coder-30B-A3B Q4) NUMA 4×48t consolidation. See deprecation notes above."
  prompt_lookup: true  # would enable ngram lookup for all workers if revived

  # Scaling parameters
  expansion_threshold: 4  # Concurrent tasks to trigger WARM expansion
  warm_timeout_seconds: 300  # Shutdown idle WARM workers after 5 minutes
  health_check_interval: 30

  # Model paths
  model_base_path: /mnt/raid0/llm/models

  workers:
    # === HOT WORKERS (DEPRECATED — GGUFs not on disk; canonical-recipe quality 44% << worker_general 84%) ===
    explore:
      port: 8082
      model: Qwen/Qwen2.5-7B-Instruct-GGUF/Qwen2.5-7B-Instruct-Q4_K_M.gguf  # NOT ON DISK
      tier: hot

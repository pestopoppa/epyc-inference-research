                          # ik_llama.cpp serializes drafter→verifier within a step; dedicated
                          # threads should reduce thread-pool contention on the small 4-layer drafter.
      ubatch: 512         # 2026-05-08: override canonical -ub 8192 to match deep-dive's measurement
                          # recipe. MTP's per-call batched-verify of K+1 tokens may interact poorly
                          # with the larger canonical ubatch when sequence is short.
    constraints:
      forbid:
      - prompt_lookup       # Legacy prompt_lookup remains disabled; v7 common_speculative ngram modes compose with draft-mtp when explicitly launched.
      reason: "legacy prompt_lookup remains disabled; use common_speculative ngram-* + draft-mtp composition for launch-time n-gram fallback."

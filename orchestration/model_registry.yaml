      discovered: 2025-12-16
      superseded: 2026-07-31
    - issue: DEPLOYED CONTEXT IS 16384, NOT ctx_max. Both the MMMU cutover (vision_final.py) and the 2026-07-31 GPU co-residency measurement ran -c 16384. The 21,049 MB VRAM figure is a 16384-context, np=1
        figure.

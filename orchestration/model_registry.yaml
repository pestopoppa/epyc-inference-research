      device: cpu
      min_chars: 30000
      target_ratio: 0.5
      stage1_context_limit: 20000
      cache_model: true
      expected_latency_ms: 50
      quality_regression_notes: |
        DISABLED 2026-01-27: LLMLingua-2 extractive compression causes:
        - Prompt leakage in output
        - Hallucinated citations [1], [2]
        - Typos ("tokenizeize", "cUSTODY")
        - 140s vs 74s (slower, not faster)
        Root cause: Extractive compression produces choppy text that confuses LLM.
        RECOMMENDATION: Wait for Cmprsr (abstractive) weights to become available.
    cache:
      enabled: true
      ttl_hours: 24
      dir: /mnt/raid0/llm/cache/drafts
    expected_speedup:
      10k_tokens: "1.4x"           # Modest speedup at lower sizes
      20k_tokens: "1.5x"
      50k_tokens: "1.6x"           # Prefill savings accumulate
      multi_doc_5x10k: "3.9x"
    notes: |
      Three-stage pipeline: Stage 0 (compress) → Stage 1 (draft) → Stage 2 (review)
      Stage 0 benefit: quality improvement from representative sampling vs truncation.
      Breakeven at ~5K tokens. Below this threshold, overhead dominates.
      Stage 1 captures grep hits during exploration for Stage 2 context.
      Caching enables instant Stage 2 for repeated documents.
  # Backwards compatibility alias
  two_stage_summarization:
    description: "Alias for three_stage_summarization (deprecated)"
    redirect_to: three_stage_summarization
server_mode:
  # Production topology - orchestrator_stack.py launcher
  # Port 8000: Orchestrator API (uvicorn)
  # Ports 8080-8085: Model servers (llama-server) — NOT AUTHORITATIVE, four live exceptions:
  #   8070 frontdoor (+worker_summarize alias) · 8074 architect_critic (NEW 2026-07-31)
  #   8083 architect_general (+coder_escalation alias) · 8086 worker_vision (+vision_escalation)
  # Do NOT pick 8084 or 8071 for a new role: they belonged to architect_coding (removed
  # 2026-05-06) and scripts/validate/stack_change_guard.py L326/L346 reject them in
  # scripts/autopilot/program.md and scripts/server/*.sh.
  #
  # ===========================================================================
  # `serving_shape:` — THE KV-FEASIBILITY GROUP (2026-08-02, operator-ratified)
  # ===========================================================================
  # THREE FIELDS THAT ARE NOT INDEPENDENT KNOBS, so they are declared as ONE
  # block and validated together:
  #
  #     n_ctx           total context the server is launched with (-c)
  #     slots_by_shape  concurrent slots per INSTANCE SHAPE CLASS (-np)
  #     kv_quant        KV cache element types (-ctk / -ctv)
  #
  # They are coupled by two identities:
  #     KV bytes      = KiB_per_token(model, kv_quant) * n_ctx
  #     per-slot ctx  = n_ctx / slots
  # Edited in isolation, three fields can be walked into an infeasible
  # combination one commit at a time — each edit locally reasonable, the
  # combination out of memory. Edited as one block they cannot, because
  # `stack_manifest.validate_serving_shape_capacity()` recomputes the whole
  # device footprint from the block at IMPORT and refuses an oversubscribed
  # lineup. That check is the reason the grouping exists; do not split them
  # back out into flat keys "for readability".
  #
  # WHY THIS DOES NOT VIOLATE THE MODEL/PLACEMENT BOUNDARY. `full` and `half`
  # are shape CLASSES, not cpusets. This file never learns which CPUs a half
  # instance owns, how many threads it gets, or which NUMA nodes it spans —
  # that stays in epyc-orchestrator/orchestration/stack_topology.yaml, which in
  # turn never learns which model runs on it. "How many concurrent slots does
  # THIS model want on a half-size instance" is a MODEL x SHAPE fact and has no
  # other home: the topology cannot answer it (it knows no models) and a flat
  # per-role `slots` cannot express it (one role, three differently-sized
  # instances). `src/registry/stack_priors.py` is the compiler that JOINS the
  # two per instance.
  #
  # SHAPE CLASSES: `full` (NUMA_FULL), `half` (NUMA_HALF_A/B), `quarter`
  # (NUMA_Q*), `gpu_host_lane` (GPU_HOST_LANE). A role whose instances are all
  # one class needs no `slots_by_shape` at all — the flat `slots` below is the
  # single value and still works. A class absent from `slots_by_shape` falls
  # back to flat `slots`, which is how the GPU roles are declared.
  #
  # FUTURE-PROOFING (deliberately NOT built): the join reads `kv_quant` through
  # the same per-shape resolver as `slots_by_shape`, so a `kv_quant_by_shape`
  # (e.g. f16 on the full, q8_0 on the halves under memory pressure) is a
  # schema addition, not a migration. There is no measured case for it today,
  # so it does not exist yet.
  #
  # BACK-COMPAT: flat `slots:` and `kv_quant:` keys are still READ (many
  # consumers index them directly). The grouped block is the declaration going
  # forward; when both are present the group wins and the parity guard requires
  # the flat scalar to equal the group's value for the role's primary shape.
  #
  # MEASURED INPUTS carried in the block, marked as facts rather than knobs:
  #   kv_kib_per_token_f16  read out of the GGUF header —
  #       block_count * head_count_kv * (key_length + value_length) * 2 / 1024.
  #       q8_0 halves the side it is applied to; q4_0 quarters it; K and V are
  #       quantised independently. Verified 2026-08-02 by direct GGUF header
  #       read for all six production models.
  #   vram_non_kv_gib       GPU roles only: everything resident that is NOT KV
  #       (weights + mmproj + graph/compute buffers). Measured 2026-08-02 from
  #       /sys/class/kfd per-process VRAM minus the computed KV at the then-live
  #       -c 16384. Do NOT use the `vram_gib:` figures for this — those are
  #       KV-INCLUSIVE totals at some past context and would double-count.

  # HOT tier - always resident (~40GB total)
  frontdoor:
    # 2026-07-30: private per-instance weights. Under shared mmap the GGUF's
    # pages are placed ONCE by whichever process faults them first, and every
    # later instance inherits that placement regardless of its own --membind /
    # --interleave. Measured: 4 co-resident instances at 0.256/0.256/0.242/0.269
    # node-local under mmap vs 1.00 each under --no-mmap, fleet decode 40.91 ->
    # 52.13 tok/s. Without this the numactl policy in stack_numa.py is accepted
    # and silently does nothing.
    no_mmap: true
    url: http://localhost:8070
    port: 8070
    # 2026-08-02: was 2. This is now the COMPAT SCALAR for `serving_shape.slots_by_shape`
    # and must equal the value of the role's primary (endpoint) instance, which is the
    # full one on :8070. The guard enforces that equality.
    slots: 4
    serving_shape:
      n_ctx: 262144
      slots_by_shape: {full: 4, half: 1}   # 262144/4 = 65536 per slot on the full,
                                            # 262144/1 = 262144 per slot on each half
      kv_quant: {k: q8_0, v: q8_0}          # Q8 KV (lean parity) — moved here from the flat key
      kv_kib_per_token_f16: 82.0            # qwen35moe: 41 blocks x 2 kv-heads x (256+256) x 2 / 1024
                                            # => 41.0 KiB/token at q8_0/q8_0, 10.25 GiB per instance
    chat_template_kwargs:
      enable_thinking: false  # Qwen3.6 thinking OFF for task suites (lean parity; +33pp empirically)
    # Terseness-template PILOT per operator directive 2026-08-21/22: serve the epyc-built
    # terse template (sha256 first-12: 1443ea9ab4bb) instead of the GGUF-embedded one.
    # CT-1b evidence: epyc-root handoffs/active/qwen-chat-template-evaluation.md — never worse,
    # significantly better where budget binds, 34-99.5% fewer answer tokens on Qwen3.6-35B-A3B.
    # REVERT: removing the single chat_template_file line below fully reverts the pilot.
    chat_template_file: /mnt/raid0/llm/models/chat-templates/epyc-qwen3x-v1-terse.jinja
    chat_template:
      provenance: epyc_built_terse_v1
      served_template_bytes: 25808
      served_template_sha256_12: 1443ea9ab4bb
      base: froggeric v22.3 minus inline-tag scan plus Sharp terseness
      evidence: 'CT-1b A/B artifacts: /workspace/artifacts/chat-templates/epyc-qwen3x-v1/ab-cpu-20260821/ct1b-terse/.
        E-7: frontdoor''s calibration stamps are voided by the template axis and must re-measure.'
    model_role: qwen36_q8_0
    shared_with: [worker_summarize]  # 2026-07-31: coder_escalation REMOVED from this list —
                       # it moved to architect_general's :8083 GPU process (Directive 3), so it is no
                       # longer served by frontdoor. worker_summarize is frontdoor's ONE remaining
                       # alias on :8070.
                       # registry_compiler.py:71-73 reads THIS to resolve an alias role to its serving
                       # process. The list was [] until 596a1e24 restored it (a drift guard caught the
                       # emptiness and was RIGHT — the data was wrong, not the guard); 596a1e24's own
                       # comment required this narrowing to land in the SAME commit as the repoint,
                       # never split. It did.
    description: Root LM — Qwen3.6-35B-A3B MTP Q8 (quality 93%, May-4 Claude-as-Judge 170/183; v6 NEXTN self-draft)
    benchmark_date: 2026-05-04
    benchmark_score: 170/183 (92.9%)
    model: Qwen3.6-35B-A3B-MTP-Q8_0.gguf
    model_path: /mnt/raid0/llm/models/Qwen3.6-35B-A3B-MTP-Q8_0.gguf
    draft_model: Qwen3.6-35B-A3B-MTP-Q8_0.gguf
    # kv_quant MOVED 2026-08-02 into `serving_shape` above — it is one third of the
    # KV-feasibility group, not a free-standing knob. The flat key is still READ for
    # rows that have not migrated; leaving a second copy here would be the duplication
    # the group exists to remove.
    memory_gb: 37
    tier: hot
    # 2026-07-30: quarters retired. These are the SUB-FULL instances only —
    # the full lives at `port` above. Halves reuse the first two quarter port
    # slots; 8280/8380/8282/8382/8385/8485 are FREED and must not be revived
    # without a topology change, because several fail-open paths treat an
    # unknown port as lock-free (backend.py:207, placement.py:186,
    # cpu_region_lock.py:641).
    numa_instances: 2  # 2×48t NUMA-half instances (nodes 0,1 and 2,3)
    numa_ports: [8080, 8180]
    acceleration:
      type: speculative_decoding
      # CANONICAL: see top-level `speculative_decoding_policy`. MTP self-draft ALONE
      # is the production recipe (was `draft-mtp` alone until 2026-07-31).
      spec_type: draft-mtp
      draft_max: 4
      lookup: false
      corpus_retrieval: true
    throughput: 40.22  # category=OPTIMUM t/s, full instance canonical placement, draft-mtp, short ctx.
                       # Long ctx 22.59. Was 24.3 (a May-4 figure equal to its own baseline) until 2026-07-31.
                       # q_scorer.registry_baseline_tps_by_role reads THIS FIRST, ahead of roles.*.performance,
                       # so correcting roles/ alone left the cost model stale.
    previous_model: Qwen3.5-35B-A3B-UD-Q4_K_M.gguf  # frontdoor swapped to Qwen3.6 Q8 2026-05-04 (lean)

  # qwen25_coder_32b_q4km: launch spec preserved from the former coder_escalation model
  # (role realigned to Qwen3.6 2026-05-27; kept per model_not_role_indexing). Not in process_layout.
  qwen25_coder_32b_q4km:
    url: http://localhost:8081
    port: 8081
    slots: 1  # Sweep 2026-02-19: p95 1.98x at concurrency=2, serial only
    model_role: qwen25_coder_32b_q4km
    description: Escalation code generation with spec decode + prompt lookup fallback (former coder_escalation; Qwen2.5-Coder-32B-Q4)
    model: Qwen2.5-Coder-32B-Instruct-Q4_K_M.gguf
    draft_model: Qwen2.5-Coder-0.5B-Instruct-Q8_0.gguf
    memory_gb: 20
    tier: hot
    acceleration:
      type: speculative_decoding
      draft_max: 32   # sweep-verified 2026-03-21 (was 24)
      p_split: 0.05   # tree beneficial on Q4KM (+2.7%), sweep-verified 2026-03-21
      lookup: true  # Prompt n-gram lookup as fallback (--lookup flag, commit 8e35dbc01)
      corpus_retrieval: true  # A/B: +8.7pp acceptance, +6% speed
    throughput: 10.8   # t/s at 48t NUMA deployment (sweep 2026-03-21). 192t ref: 12.2. Old 39.44 was inflated.

  coder_escalation:
    # 2026-07-31: GPU-RESIDENT ALIAS. The 2026-07-30 no_mmap rationale was a NUMA host-RAM
    # placement remedy; it is inert for a role whose weights live in VRAM under -ngl all.
    # Retained (harmless).
    no_mmap: true
    url: http://localhost:8083
    port: 8083
    slots: 1
    chat_template_kwargs:
      enable_thinking: false
    # 2026-08-20 Qwen3.6->Qwen3.8 swap: this MUST move with model_path. model_role is load-bearing —
    # model_descriptors.py:1233-1244 substitutes the model_role role's config when an alias's model id
    # differs from its server_mode entry (recording ignored_model_id), so a stale value here would
    # silently serve the OLD artifact while the registry read as swapped.
    model_role: qwen38_27b_q8_local
    description: "Coding escalation — Qwen3.8-27B dense Q8 MTP on MI210 (ROCm0). 2026-08-20: artifact swapped from Qwen3.6-27B-MTP-Q8_0. 2026-07-31: MOVED off frontdoor's :8070 shared 35B process onto architect_general's :8083 GPU process; alias, launches no server of its own. Quality on this model NOT yet measured for the coder suite. Former Qwen2.5-Coder-32B-Q4 preserved as qwen25_coder_32b_q4km."
    alias_of: architect_general   # documentation; the load-bearing binding is server_mode.architect_general.shared_with
    benchmark_date: null   # 2026-07-31 model swap: 35B bench voided, 27B not yet run
    benchmark_score: null  # was "170/183 (93%)" = Qwen3.6-35B-A3B May-4 Claude-as-Judge; belongs to frontdoor's model, NOT this one
    model: Qwen3.8-27B-Q8_0.gguf
    model_path: /mnt/raid0/llm/models/Qwen3.8-27B-Q8_0.gguf
    # FLAT `kv_quant` DELIBERATELY RETAINED (not migrated into `serving_shape`).
    # coder_escalation is an ALIAS on architect_general's :8083 process — it launches
    # no server, so it HAS no serving shape of its own; giving it a `serving_shape`
    # block would assert one. This row is the back-compat read path the group's
    # migration note describes, and it is exercised by the derived kv_quant table.
    kv_quant: {k: q8_0, v: q8_0}
    memory_gb: 27   # Qwen3.6-27B Q8 weights (27.05 GiB); GPU-resident on ROCm0 — VRAM, not host RAM
    vram_gib: 36.70 # shared with architect_general: ONE process, ONE allocation. This alias adds ZERO cost.
    tier: hot
    acceleration:
      # ALIAS ROLE — 2026-07-31: MOVED OFF frontdoor. coder_escalation now shares
      # architect_general's :8083 MI210 llama-server process and does NOT launch its own server.
      # It INHERITS architect_general's speculative recipe at runtime (draft-mtp self-draft,
      # n-max 4) regardless of what this block says. `type: none` means "launches no draft of

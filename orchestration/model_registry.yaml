# =============================================================================
# Model Registry Configuration
# =============================================================================
#
# Path Configuration:
#   All paths are relative to the base paths defined here or can be overridden
#   via environment variables (see .env.example):
#     - ORCHESTRATOR_PATHS_LLM_ROOT (default: /mnt/raid0/llm)
#     - ORCHESTRATOR_PATHS_MODEL_BASE (default: ${LLM_ROOT}/lmstudio/models)
#     - ORCHESTRATOR_PATHS_LLAMA_CPP_BIN (default: ${LLM_ROOT}/llama.cpp/build/bin)
#
# Model Downloads:
#   Models with huggingface_id can be downloaded via:
#     python scripts/setup/download_models.py --tier hot
#
# =============================================================================

# =============================================================================
# EVIDENCE CITATIONS MUST RESOLVE  (2026-08-02; retargeted 2026-08-03)
# =============================================================================
#
# Every path in this file that backs a MEASUREMENT must RESOLVE on this host to a
# readable artifact that is not in a scratch directory. That is a hard rule,
# enforced by
#
#     python3 scripts/validate/check_evidence_durability.py
#
# It now runs automatically, four ways: `make evidence-check`; `make test` and
# `make lint` (it is in PYTEST_SMOKE and PYTHON_SMOKE); `scripts/session/
# health_check.sh`; and a scoped `.git/hooks/pre-commit.extras` that checks the
# STAGED blob whenever this file is committed. Until 2026-08-03 this comment was
# the only reference to it anywhere, so it had never run without being remembered
# — which is the failure mode it exists to catch, applied to itself.
#
# WHY. On 2026-08-02 this registry cited 157 distinct artifacts under the scratch
# root (`llm/tmp`) as the evidence behind ratified, production-affecting claims.
# Nothing had been lost yet; the whole set was one `rm -rf` away. They were copied
# into data/<campaign>/ (byte-for-byte, sha256 verified both ends, each campaign
# carrying a README.md and SHA256SUMS) and every citation here was repointed.
#
# MEASUREMENT.md:139-141 requires evidence HASHES in the apply-time ratification
# bundle but says nothing about whether the artifact must still be there. A bundle
# can therefore hash a file in /tmp, be signed, and become unverifiable the moment
# that file is swept — a hash proves nothing with no artifact to check it
# against. The validator closes that gap. It enforces a CONVENTION; it does not
# amend the constitution, which is human-amendment-only.
#
# WHAT CHANGED 2026-08-03. This block used to read "lives inside this repository,
# as a repo-relative `data/...` path", and the validator graded that. The operator
# then ruled that research material reaches GitHub ONLY as distilled knowledge and
# references in the wiki — never as raw material, REGARDLESS OF SIZE. Benchmark
# suites, benchmark data, campaign output, run bundles and logs stay on local disk
# and gitignored; a clone carries the FINDINGS, not the substrate. So in-repo,
# out-of-repo, tracked and gitignored are now all equally fine here, and whole
# campaign trees cited below are deliberately gitignored (see .gitignore). What
# is NOT fine, and is not negotiable, is a citation that resolves nowhere or
# resolves into scratch: that is the hash-with-no-artifact failure above, and it
# is precisely BECAUSE the substrate is no longer carried by git that something
# has to keep proving the local artifact is still there.
#
# Two exceptions, both explicit and both machine-recognised:
#   * `ARTIFACT LOST` — the artifact is gone. Four build-tree binaries under two
#     throwaway llama.cpp source trees in scratch were already absent. Build
#     products, not measurement results, so nothing reproducible was lost. The
#     dead path is kept VERBATIM so provenance survives, with the marker on the
#     same line. Do not delete it, and do not invent a replacement.
#   * `.gguf.sha256` sidecars — two ~1079 MiB imatrix blobs are intentionally not
#     carried (`*.gguf` is .gitignored). The citation points at a sidecar holding
#     the sha256, size and scratch origin, so the hash stays in-tree.
#
# =============================================================================

# =============================================================================
# CANONICAL: speculative-decoding recipe policy
# =============================================================================
#
# THIS BLOCK IS THE SINGLE SOURCE OF TRUTH for what speculative-decoding recipe
# production runs. Every other document, handoff, wiki page, harness header and
# code comment MUST LINK HERE rather than restate the recipe. Restated content
# rots; this block does not.
#
#   Anchor for cross-references:
#     epyc-inference-research/orchestration/model_registry.yaml
#       -> speculative_decoding_policy
#
speculative_decoding_policy:
  canonical: true
  ratified_by: operator
  ratified_on: 2026-07-31
  supersedes: >
    All prior per-role prose describing `draft-mtp` alone as the production
    recipe, and the `ngram_candidate_spec_type` field (RETIRED — see below).

  # ---------------------------------------------------------------------------
  # THE RECIPE
  # ---------------------------------------------------------------------------
  production_recipe: draft-mtp
  statement: >
    Production runs `--spec-type draft-mtp` — MTP self-draft ALONE. The n-gram
    lane is NOT composed in. This applies to every role that has a working draft
    path.

  superseded_recipe: >
    REVERSED 2026-07-31 (same day it was adopted). The composed recipe
    `ngram-mod,draft-mtp` was adopted on the expectation of a large upside on
    repetitive / token-reuse context, with a measured -1.6% cost on ordinary text
    accepted in exchange. The long-context coding test that was supposed to
    demonstrate that upside instead falsified it, and the exception case was
    falsified independently. The trade was made with eyes open and is now unmade
    on evidence.

  evidence_for_reversal:
    long_context_coding_35b: >
      Qwen3.6-35B-A3B Q8, 12 matched prompts at 15k-28k context (extend / port /
      fill-in-the-middle / prose). Composed won 0 of 12. Mean -4.06% against the
      first draft-mtp baseline and -8.24% against a second replicate of the SAME
      baseline config. Mechanism is in the counters: composed drafts MORE and
      accepts LESS (extend_3: 518 -> 708 drafts, acceptance 0.734 -> 0.540). Each
      rejected draft costs a full verification pass.
    long_context_coding_gemma: >
      gemma-4-26B-A4B Q4_K_M, same 12 prompts. Mean -0.04%. The real result is
      structural, not numeric: n-gram produced ZERO drafts on 9 of 12 prompts —
      those arms are byte-identical in acceptance, draft count and tok/s. Coding
      output does not contain n-grams repeated from its context. Where it did
      fire (the 3 fill-in-the-middle prompts) acceptance fell from 0.78/0.84/0.78
      to 0.67/0.68/0.62.
    ordinary_text: >
      -1.6% mean on non-repetitive prose/code. Independent distinct-prompt re-run
      (ngramfix): -4.2% to +1.3% composed vs draft-mtp; n-gram ALONE costs 23-31%.
    retracted_positive: >
      The 2.80x that originally motivated composed was RETRACTED — a warm-context
      self-copy artifact from repeating one prompt, so the model copied its own
      prior answer (mean accepted length 3.58 -> 15.88, acceptance -> 1.000).
    harness_caveat: >
      The 35B coding run executed its arms sequentially and its two same-config
      replicates differ by +4.17% (11/11 consistent), i.e. monotonic host drift
      over the ~2h window. DIRECTION survives — composed loses against both the
      early and the late baseline, 0/12 and 0/11 — but quoted MAGNITUDES are soft.

  where_ngram_does_win: >
    TASK-CLASS SCOPED, not a default. Composed wins only where the OUTPUT repeats
    itself or repeats the input verbatim, AND verification is cheap (small active
    parameter count). Measured on fresh servers: gemma-4-26B-A4B Q4_K_M on a
    repetitive strict-JSON tool_call, 143.58 -> 330.57 t/s (2.30x); Qwen3.5-9B
    Q4_K_M generating 1024 literal repetitions of one word, 114.81 -> 466.47 t/s
    (4.06x). The SAME gemma fixture on a non-repetitive coding explanation
    (harness-verified repeated_5grams = 0) gave +0.07% — a dead wash — and the
    n-gram arm FAILED a quality check the draft-mtp arm passed. Large models lose
    outright: Qwen3-Coder-480B refactoring -34% at 18.4% acceptance.
    Re-enabling composed for a specific role requires measuring THAT role's real
    traffic, not a synthetic repetitive fixture.

  # ---------------------------------------------------------------------------
  # THE EXCEPTION
  # ---------------------------------------------------------------------------
  exceptions:
    ingest_long_context:
      model: Qwen3-Next-80B-A3B-Instruct
      spec_type: none
      category: OPTIMUM          # NOT a baseline. See category grammar below.
      reason: >
        Qwen3-Next-80B is an SSM/MoE hybrid. Its recurrent state cannot fork, so
        NO external draft-model path exists and none can be built. n-gram alone
        yields 1.6-4.7% acceptance, i.e. nothing. `--spec-type none` is therefore
        the BEST AVAILABLE configuration for this model — it is this model's
        OPTIMUM and BELONGS IN HEADLINE TABLES. It is emphatically NOT a
        baseline and must never be excluded from a headline on the grounds that
        "speculation is off". That exact mistake was made on 2026-07-31.

  # ---------------------------------------------------------------------------
  # CATEGORY GRAMMAR — the three things that keep getting conflated
  # ---------------------------------------------------------------------------
  # Conflating these is the specific defect that has cost repeated wasted
  # measurement runs. Every reported measurement MUST declare its category.
  measurement_categories:
    BASELINE: >
      An optimization the model HAS, deliberately switched OFF. Diagnostic only.
      Belongs in an addendum. NEVER a headline number. NEVER a comparison arm in
      a promotion decision. A BASELINE regression does NOT block a promotion; a
      BASELINE improvement is NOT a promotion argument.
    OPTIMUM: >
      The best configuration AVAILABLE for that model. If a model has no draft
      path, running it with `--spec-type none` IS its OPTIMUM (see
      ingest_long_context above) — that is not a baseline and it belongs in
      headline tables. Promotion decisions are made between OPTIMUM configs and
      nothing else.
    CANDIDATE: >
      Measured but NOT adopted. Must be labelled as such so it is never mistaken
      for what production runs.

  promotion_rule: >
    Promotion is decided on the production-OPTIMAL configuration alone. A
    regression in a BASELINE-category measurement is not a promotion blocker and
    must not be cited as one. See MEASUREMENT.md / agents/shared/MEASUREMENT_POLICY.md
    for the ratified constitution-level wording.

  # ---------------------------------------------------------------------------
  # WHERE THIS VALUE ACTUALLY TAKES EFFECT (read before assuming a fix landed)
  # ---------------------------------------------------------------------------
  # The launcher does NOT read this file directly. The chain is:
  #
  #   1. THIS master registry  (epyc-inference-research/orchestration/model_registry.yaml)
  #        |  recompiled at every `orchestrator_stack.py start` (--compile-registry, default ON)
  #        v
  #   2. LEAN registry         (epyc-orchestrator/orchestration/model_registry.yaml)
  #        |  recompiled ONLY by scripts/registry/stack_change_pipeline.py
  #        |  ** NOT regenerated at start **
  #        v
  #   3. stack_priors.yaml     (epyc-orchestrator/orchestration/derived/stack_priors.yaml)
  #        |  read verbatim by orchestrator_stack.py:_stack_prior_launch()
  #        v
  #   4. llama-server argv     (orchestrator_stack.py:_append_spec_decode_args, ~line 278)
  #
  # Editing THIS file changes step 1 and 2 only. Until the stack-change pipeline
  # regenerates step 3, the launcher keeps emitting whatever stack_priors.yaml
  # already says. ALWAYS verify the realized flags with `ps -eo args` on a
  # running server, or by reading
  # `orchestration/derived/stack_priors.yaml -> roles.<role>.serving.launch.runtime.flags.spec`.
  effective_only_after: >
    scripts/registry/stack_change_pipeline.py must regenerate
    orchestration/derived/stack_priors.yaml before a registry spec_type change
    reaches a launched server. A master-registry edit alone does NOT change
    production behaviour.

  retired_fields:
    ngram_candidate_spec_type: >
      RETIRED 2026-07-31. This field previously carried `ngram-mod,draft-mtp`
      while `spec_type` carried `draft-mtp`, which read as "the real one is
      elsewhere" and directly caused mis-launched measurement runs. The composed
      recipe is now the value of `spec_type` itself. Any surviving occurrence of
      this key is stale and MUST be deleted, not consulted.


  #   consult: interaction_skills.architect_critic.critique_plan via consultation.py::consult()
  #   routed:  terminal hop of escalation_chains.reasoning + the B3 routing_hints
  #   autopilot: MUST be a selectable arm. YAML ALONE IS NOT ENOUGH — see the code surfaces in
  #     the change record (src/roles.py Role enum, q_scorer role tables, config ServerURLs/
  #     Timeouts, config_applicator RoleRestartKnob, stack_manifest ROLE_LAUNCH_META + NUMA_CONFIG).
  architect_critic:
    # 2026-07-30: private per-instance weights. Under shared mmap the GGUF's pages are placed
    # ONCE by whichever process faults them first. Measured: 4 co-resident instances at
    # 0.256/0.256/0.242/0.269 node-local under mmap vs 1.00 each under --no-mmap.
    no_mmap: true
    url: http://localhost:8074
    port: 8074
    # 2026-08-02: was 2. Compat scalar for `serving_shape.slots_by_shape`; the role has
    # exactly one instance and it is the full, so the two agree trivially.
    slots: 1
    serving_shape:
      n_ctx: 262144
      # ONE INSTANCE, ONE CLASS. `slots_by_shape` is written out rather than left to the
      # flat scalar because this role's single full instance on 0-95 holds all four CPU
      # region locks, and a future reader adding a half here must be forced to state its
      # slot count rather than inherit the full's.
      slots_by_shape: {full: 1}            # 262144/1 = 262144 per slot
      kv_quant: {k: q4_0, v: f16}          # RECORDED, NOT CHANGED: the live :8074 process was
                                           # already running -ctk q4_0 -ctv f16 (verified from
                                           # /proc/2020129/cmdline, 2026-08-02). Asymmetric on
                                           # purpose — K quarters cleanly, V at f16 preserves
                                           # critic quality. Declared only in launch_manifest
                                           # until now.
      kv_kib_per_token_f16: 98.0           # qwen35moe: 49 blocks x 2 kv-heads x (256+256) x 2 / 1024
                                           # => K 12.25 + V 49.0 = 61.25 KiB/token as quantised,
                                           # 15.31 GiB at n_ctx 262144
    chat_template_kwargs:
      enable_thinking: false
    model_role: qwen35_122b_q4km
    description: Adversarial plan critic — Qwen3.5-122B-A10B MoE (quality 2.57/3). Inherited from architect_general 2026-07-31. Consultable (architect_critic.critique_plan) AND routable (boosted-reasoning escalation).
    previous_wiring: architect_general_8083  # identical GGUF + placement; role split 2026-07-31
    # Phase 3 compliance gate (2026-05-07): aggressive passes (117% baseline compliance,
    # 110% procedure, recall 0.93). Compression actively helps this model.
    agent_file_compression_operating_point: aggressive
    model: /mnt/raid0/llm/models/Qwen3.5-122B-A10B-MTP-GGUF/UD-Q4_K_M/Qwen3.5-122B-A10B-UD-Q4_K_M-00001-of-00003.gguf
    draft_model: /mnt/raid0/llm/models/Qwen3.5-122B-A10B-MTP-GGUF/UD-Q4_K_M/Qwen3.5-122B-A10B-UD-Q4_K_M-00001-of-00003.gguf  # NEXTN self-draft = same file; launcher omits -md
    memory_gb: 69
    tier: hot  # OPERATOR DECISION 2026-07-31: "lets keep it hot, it costs us very little".
               # THE REAL COST IS NOT RAM: this role's single full instance on 0-95 holds ALL
               # FOUR CPU region locks, so while it runs it serializes the entire CPU NUMA
               # topology (stack_numa.py:274-276). Inherent and accepted for this role.
    acceleration:
      type: speculative_decoding
      # CANONICAL: top-level speculative_decoding_policy. MTP self-draft ALONE. The n-gram lane
      # was REVERSED OUT 2026-07-31 (commit a126e43d) — do NOT reintroduce ngram-mod here.
      spec_type: draft-mtp
      draft_max: 4
      draft_model: /mnt/raid0/llm/models/Qwen3.5-122B-A10B-MTP-GGUF/UD-Q4_K_M/Qwen3.5-122B-A10B-UD-Q4_K_M-00001-of-00003.gguf
      lookup: false
    numa_instances: 1
    numa_ports: [8074]
    # ── THROUGHPUT PRIOR ── category=OPTIMUM, 2026-07-31. Full instance, canonical placement,
    # production spec recipe (draft-mtp). Source: published stack measurement record §01
    # (Qwen3.5-122B-A10B Q4_K_M row: FULL 24.00 short / 15.76 long).
    # Does NOT inherit 12.19 (2026-05-04 spec-off probe). Do NOT use 8.21 / "~8 t/s" — that is
    # Qwen3-235B-A22B, a different model.
    throughput: 24.00               # category=OPTIMUM, short ctx
    throughput_long_context: 15.76  # same recipe, long ctx. Not read by any prior surface today
                                    # (all are scalar); carried so the spread is auditable and
                                    # so the timeout is sized on the pessimistic leg.
    throughput_spec_off: 11.30      # protocol record only; never a headline
    benchmark_date: 2026-07-31
  architect_coding:
    deprecated: true
    deprecated_date: 2026-05-27
    deprecated_reason: "Role removed in the 2026-05 production stack consolidation; model REAP-246B deprecated + GGUF deleted 2026-05-27, original 480B never on local disk. Removed from escalation chains."
    url: http://localhost:8084
    port: 8084
    slots: 1  # Serial — admission=1, no wasted KV
    model_role: architect_coding
    description: Hardest coding escalation - largest MoE (full experts for quality)
    model: Qwen3-Coder-480B-A35B-Instruct-Q4_K_M.gguf
    draft_model: Qwen3-Coder-Instruct-DRAFT-0.75B-32k-Q4_0.gguf
    memory_gb: 272
    tier: warm
    acceleration:
      type: speculative_decoding
      draft_max: 24   # sweep-verified 2026-03-21 (was 48; dm=24 beats dm=48)
      p_split: 0      # linear only — tree is HARMFUL (-19%), sweep-verified 2026-03-21 (was 0.05)
      lookup: true  # A/B best result: +15.6pp acceptance, +17% speed with corpus
      corpus_retrieval: true  # A/B BEST: +15.6pp acceptance (74.9→90.5%), +17% speed (8.3→9.7 t/s)
    throughput: 7.0    # t/s at 96t NUMA deployment (sweep 2026-03-21). 192t ref: 7.1. Old 9.00 was different config.

  ingest_long_context:
    # 2026-07-30: private per-instance weights. Under shared mmap the GGUF's
    # pages are placed ONCE by whichever process faults them first, and every
    # later instance inherits that placement regardless of its own --membind /
    # --interleave. Measured: 4 co-resident instances at 0.256/0.256/0.242/0.269
    # node-local under mmap vs 1.00 each under --no-mmap, fleet decode 40.91 ->
    # 52.13 tok/s. Without this the numactl policy in stack_numa.py is accepted
    # and silently does nothing.
    no_mmap: true
    url: http://localhost:8085
    port: 8085
    # 2026-07-30: declared for the first time. This role previously had NO
    # numa_ports, so src/fleet.py hardcoded a 5-port list for it — a second
    # source of truth that went stale the moment the topology changed. Declaring
    # them here lets fleet.py derive instead of restating.
    # Quarters retired; halves reuse the first two quarter port slots.
    # 8385/8485 are FREED and must not be revived without a topology change:
    # several dispatch paths fail OPEN on an unknown port (backend.py:207,
    # placement.py:186, cpu_region_lock.py:641 yields no lock at all).
    numa_instances: 2  # 2×48t NUMA-half instances (nodes 0,1 and 2,3)
    numa_ports: [8185, 8285]
    # 2026-08-02: was 1. Compat scalar for `serving_shape.slots_by_shape`; must equal the
    # primary (endpoint) instance's value, i.e. the full on :8085.
    slots: 1
    serving_shape:
      n_ctx: 262144
      # This is the ONE role whose split shape beats its full under load (aggregate tok/s
      # at T=8: half 86.17 vs full 72.53), so the halves get the same slot count as the
      # full rather than a reduced one — they are the preferred shape here, not a fallback.
      slots_by_shape: {full: 1, half: 1}   # 262144 per slot on every instance
      kv_quant: {k: q4_0, v: q4_0}         # RECORDED, NOT CHANGED: :8085/:8185/:8285 were already
                                           # running -ctk q4_0 -ctv q4_0 (verified from
                                           # /proc/<pid>/cmdline, 2026-08-02).
      # ⚠ UPPER BOUND, NOT AN EXACT FIGURE — and deliberately left conservative.
      # qwen3next is an SSM/MoE HYBRID: the formula below assumes all 48 blocks carry
      # attention KV, but in a hybrid only a fraction do (the rest hold a recurrent
      # state whose size is context-INDEPENDENT). The real footprint is therefore
      # LOWER than 6.0 GiB per instance. Do NOT "correct" this downward without
      # measuring the actual per-block layout — over-stating the model that is not the
      # binding constraint (gemma4 is, at 30x this role's KV) is the safe direction,
      # and a capacity gate that under-states is worse than useless.
      kv_kib_per_token_f16: 96.0           # qwen3next: 48 blocks x 2 kv-heads x (256+256) x 2 / 1024
                                           # => 24.0 KiB/token at q4_0/q4_0, <= 6.0 GiB per instance
    model_role: ingest_long_context
    thinking_control:
      mode: template_ignores_enable_thinking
      effective_mode: native
      evidence_strength: direct_registry_note
      evidence: Current Qwen3-Next GGUF template ignores chat_template_kwargs.enable_thinking; preserve native behavior.
    description: Accuracy-critical + long-context router specialist - SSM+MoE hybrid linear attention (NO speculation!)
    # Phase 3 compliance gate (2026-05-07): medium passes; aggressive fails procedure (89%
    # baseline). Compliance pinned 0.933 across all 4 levels, recall 0.93-1.00.
    agent_file_compression_operating_point: medium
    model: Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
    memory_gb: 46
    tier: hot
    acceleration:
      type: none  # 2026-07-17: default experts; stale MoE4 override removed from live ingest policy
      # CANONICAL: see top-level `speculative_decoding_policy` -> exceptions.ingest_long_context.
      # `none` IS THIS MODEL'S OPTIMUM — it is NOT a baseline.
      # Qwen3-Next-80B is an SSM/MoE hybrid: its recurrent state cannot fork, so
      # NO draft-model path exists and none can be built. n-gram alone yields
      # 1.6-4.7% acceptance (i.e. nothing). `--spec-type none` is therefore the
      # BEST AVAILABLE config for this role and BELONGS IN HEADLINE TABLES.
      # Do NOT exclude this role from a headline on the grounds that
      # "speculation is off" — that mistake was made on 2026-07-31.
      spec_type: none
      spec_category: OPTIMUM   # NOT BASELINE. See measurement_categories in the policy block.
    throughput: 14.4-20.8
    benchmark_score: 25/27 (93%) on canonical long_context suite, May-4
    notes: "SSM-hybrid linear attention scales O(n) per token — at extreme contexts (50K+) outperforms pure-attention models. Best Stage-1 candidate for three_stage_summarization (full-context fast draft). Stage-2 review now uses frontdoor (Qwen3.6-35B-A3B Q8, 100% long_context). Historical MoE4 rows are not live launch policy as of 2026-07-17."


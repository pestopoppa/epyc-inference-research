    description: Qwen3-VL-30B-A3B-Instruct — PRODUCTION vision model 2026-07-31, serving BOTH worker_vision and vision_escalation from one MI210 (ROCm0) process on port 8086
    quirks:
    - issue: "Expert reduction is AVAILABLE but must NOT be used. GGUF default is qwen3vlmoe.expert_used_count=8 (of 128). The 2026-07-17 K35 runs forced 4; that is NOT the production recipe."
      workaround: "Launch with GGUF defaults — do NOT pass --override-kv qwen3vlmoe.expert_used_count. (This entry previously PRESCRIBED int:4; corrected 2026-07-31.)"

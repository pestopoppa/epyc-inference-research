      corrected: 2026-07-31
    - issue: Requires mmproj file for vision
      workaround: Use --mmproj mmproj-Qwen3-VL-30B-A3B-Instruct-F16.gguf
      discovered: 2025-12-16
    - issue: "Upstream warns at load that Qwen-VL needs >=1024 image tokens to function correctly."
      workaround: "Always launch with --image-min-tokens 1024."
      discovered: 2026-07-31
    - issue: "Server prompt cache is pure churn on vision traffic — every request carries a different image, so it never hits."
      workaround: "Launch with --cache-ram 0."
      discovered: 2026-07-31
    - issue: "Cold load ~15-20s for the 18GB model (CPU-era figure)."
      workaround: "Superseded on the deployed path: MI210 with -ngl 999 cold-loads in 4.0 s (measured 2026-07-31). The 15-20 s figure applies to CPU launches only."
      discovered: 2025-12-16
      superseded: 2026-07-31
    - issue: "DEPLOYED CONTEXT IS 16384, NOT ctx_max. Both the MMMU cutover (vision_final.py) and the 2026-07-31 GPU co-residency measurement ran -c 16384. The 21,049 MB VRAM figure is a 16384-context, np=1 figure."
      workaround: "Do not launch near ctx_max 262144 — the four-model steady state already sits at 62.59 of 63.98 GiB (1.40 GiB headroom)."
      discovered: 2026-07-31
  qwen25_coder_0_5b:
    description: Qwen2.5-Coder-0.5B (draft_qwen25_coder)

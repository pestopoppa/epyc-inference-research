process_layout:
  hot_resident:
  # 2026-07-31: this is a FLAT list — it encodes nothing about process sharing. Grouping is by
  # comment only. :8070 = frontdoor + worker_summarize. :8083 = architect_general +
  # coder_escalation. :8086 = worker_vision + vision_escalation (one process, one 21049 MB
  # VRAM allocation; BOTH names stay listed because stack_manifest.validate_against_registry()
  # warns in both directions on alias drift).
  - frontdoor
  - worker_summarize      # frontdoor's ONE remaining alias on :8070 (Directive 3)
  - architect_general     # MOVED from warm_mmap; GPU-resident on ROCm0, :8083
  - coder_escalation      # MOVED off :8070 — alias on architect_general's :8083
  - architect_critic      # NEW: 122B inherited from architect_general, CPU, :8074, tier hot
  - worker_general
  - worker_math
  - toolrunner
  - ingest_long_context
  - worker_vision
  - vision_escalation
  warm_mmap: []
  # 2026-07-31: architect_general MOVED to hot_resident — GPU-resident on ROCm0, not a CPU warm
  # mmap. This also resolves a PRE-EXISTING contradiction: server_mode.architect_general has said
  # `tier: hot` since the 2026-05 promotion while this list and roles.architect_general.memory
  # said warm. Leaving it here would mmap-preload a 27 GiB GGUF into host RAM that is also
  # going into VRAM.
  # architect_coding removed 2026-05-27 — role deprecated (model deleted).
  # architect_critic (122B, CPU, :8074) is tier HOT per operator ruling — it is in hot_resident.
escalation_chains:
  coder:
    description: "Code generation escalation path. 2026-07-31: this became a REAL escalation — frontdoor (:8070, CPU, Qwen3.6-35B-A3B MoE Q8) now hands off to coder_escalation (:8083, MI210 ROCm0, Qwen3.6-27B dense Q8). Between 2026-05-09 and 2026-07-31 both hops were the SAME GGUF in the SAME process, so escalating could only change the sampling seed."
    chain:
    - frontdoor
    - coder_escalation
    # architect_coding terminal hop removed 2026-05-27 (role deprecated; model deleted)
    triggers:
    - error_categories:
      - timeout
      - inference_error
      - internal_error
    - output_too_short: 50
    - explicit_request: true
    max_escalations: 1  # coder chain shortened to frontdoor->coder_escalation (architect_coding removed 2026-05-27)
  general:
    description: General task escalation path
    chain:
    - worker_general
    - frontdoor
    - architect_general
    - architect_critic  # terminal hop 2026-07-31: boosted reasoning
    triggers:
    - error_categories:
      - timeout
      - inference_error
    - explicit_request: true
    max_escalations: 3  # was 2 — lengthened by the architect_critic terminal hop
  reasoning:
    # NEW 2026-07-31. The operator's "boosted reasoning" path. Uses ONLY trigger keys already
    # present in the schema — no new mechanism.
    description: Boosted-reasoning escalation — terminal hop is the 122B adversarial critic
    chain:
    - frontdoor
    - architect_general
    - architect_critic
    triggers:
    # OPERATOR DECISION 2026-07-31 (D2): NARROW TRIGGERS ONLY.
    # `error_categories: [timeout, inference_error, internal_error]` and `output_too_short: 50`
    # were drafted here and were DELIBERATELY REMOVED, not forgotten.
    # architect_critic's single full instance holds ALL FOUR CPU region locks while it runs
    # (scripts/server/stack_numa.py:274-276), serializing the entire CPU NUMA topology. Firing it
    # on timeouts would make the machine's response to being slow be to invoke the one role that
    # makes everything slower — a positive-feedback loop, not a remedy.
    # Autopilot can still explore this chain (it remains a live action); it cannot be dragged in
    # by a timeout storm. Revisit only once `region_lock_wait_s_by_holder` telemetry exists —
    # stack_numa.py:268-290 asks for it before any routing knob here is widened, and it does not
    # exist anywhere in the codebase today.
    - explicit_request: true
    max_escalations: 2
routing_hints:
# ── architect_critic (NEW 2026-07-31) — MUST STAY AT THE TOP ────────────────────────────
# route_task() is first-match-wins; a boosted-reasoning request that also looks like
# interactive chat would otherwise be swallowed by the chat hint below.
# GRAMMAR WARNING, verified 2026-07-31: there are TWO condition evaluators and they differ.
#   src/registry/registry_loader.py::_eval_condition supports "key == 'lit'" and "'lit' in key".
#   orchestration/repl_memory/retriever.py:596-625 (the evaluator the LIVE chat path uses via
#   HybridRouter/RuleBasedRouter) is a SIX-LITERAL WHITELIST and supports NEITHER form.
# Under the live evaluator the three hints below never fire. They are correct against the
# registry contract and are a no-op until retriever.py learns the form — see the operator
# decision on routability. Do not delete them; do not assume they work.
- if: '''boosted reasoning'' in objective or ''deep reasoning'' in objective'
  use:
  - architect_critic
- if: '''critique'' in objective or ''adversarial review'' in objective'
  use:
  - architect_critic
- if: '''boosted_reasoning'' in constraints or ''adversarial_review'' in constraints'
  use:
  - architect_critic
- if: task_type == 'chat' and priority == 'interactive'
  use:
  - frontdoor
# 2026-07-31 LOAD SHIFT — READ BEFORE TUNING. Six routing_hints in this file send traffic to
# coder_escalation (this one plus L9251, L9255, L9285, L9290/9294, L9299/9302). Until today
# that was free: coder_escalation WAS frontdoor's :8070 process. It is now an alias on the
# MI210 (:8083), which also hosts the vision server. MEASURED CONTENTION: 27B decode falls
# 30.87 -> 19.81 t/s (-35.8%) when the other GPU tenants are active, fully reversible
# (data/gpu_coresidency_20260731/gpu_coresidency_results.json). The throughput priors below are
# ALONE figures; no derate is applied anywhere. Two external-API fallbacks (L9099, L9155)
# add to the same lane.
- if: task_type == 'code'
  use:
  - coder_escalation
- if: task_type == 'code' and 'refactor' in objective
  use:
  - coder_escalation
  - worker_general
- if: task_type == 'code' and escalation.triggered
  use:
  - coder_escalation
- if: task_type == 'ingest'
  use:
  - ingest_long_context
- if: task_type == 'doc' and priority == 'interactive'
  use:
  - frontdoor
  - worker_general
- if: task_type == 'doc' and 'summarize' in objective
  use:
  - worker_summarize
- if: task_type == 'manage'
  use:
  - frontdoor
  - toolrunner
  - worker_general
- if: '''math'' in constraints or ''invariant'' in objective'
  use:
  - worker_math
- if: '''image'' in inputs or ''screenshot'' in inputs or ''ui'' in objective'
  use:
  - worker_vision
# 2026-07-31: both hints below still name vision_escalation, which now resolves to the SAME
# MI210 process as worker_vision (:8086, Qwen3-VL-30B-A3B Q4_K_M). They no longer select a
# different model; they are retained as the documented request shapes that would justify a
# second VL tier. TWO CAVEATS, verified not assumed:
#   (a) the '"image" in inputs' hint above (L9276) matches first and route_task() is
#       first-match-wins, so the math+image hint has never been reachable;
#   (b) '!=' is not implemented by either condition evaluator, so the video hint is dead too.
# Preserved as specification, NOT as live routing. Do not "simplify" them to worker_vision.
- if: '''math'' in objective and (''image'' in inputs or ''diagram'' in inputs)'
  use:
  - vision_escalation
- if: '''video'' in inputs and priority != ''interactive'''
  use:
  - vision_escalation
- if: task_type in ['code', 'math'] and complexity == 'high'
  preprocess: formalizer
  use:
  - coder_escalation
  - worker_math
- if: '''optimize'' in objective or ''constraint'' in objective'
  preprocess: formalizer
  use:
  - worker_math
  - coder_escalation
- if: '''prove'' in objective or ''verify'' in objective'
  preprocess: formalizer
  use:
  - worker_math  # thinking_reasoning (deprecated) dropped 2026-05-27; add an active thinking role here if prove/verify needs one
- if: '''algorithm'' in objective and ''design'' in objective'
  preprocess: formalizer
  use:
  - coder_escalation  # architect_qwen2_5_72b dropped 2026-05-27 (model off-disk; role still a catalogue candidate pending deprecate/keep)
- if: ambiguity_score > 0.7
  preprocess: formalizer
  notes: Frontdoor detects vague requirements needing formalization
# 2026-07-31: architect_critic B3 hints MUST precede the bare B3 hint — route_task() breaks
# on first match (src/registry/registry_loader.py:744-745), so anything after it is dead.
- if: escalation.max_level == 'B3' and task_type == 'code'
  use:
  - architect_critic
- if: escalation.max_level == 'B3' and 'reasoning' in objective
  use:
  - architect_critic
- if: escalation.max_level == 'B3'
  use:
  - architect_general
# 2026-07-31 (D4): the duplicate `max_level == 'B3' and task_type == 'code'` hint that stood
# here has been DELETED, not retargeted. Its authoritative replacement now sits ABOVE the bare
# `max_level == 'B3'` hint, because route_task() is first-match-wins
# (src/registry/registry_loader.py:744-745) and any hint placed after the bare B3 hint is
# permanently unreachable. This one had been unreachable since it was written. Two hints for one
# condition, one of them dead, is strictly worse than one hint in the position that fires.
command_templates:
  speculative_decoding: "numactl --interleave=all \\\n  /mnt/raid0/llm/llama.cpp/build/bin/llama-speculative\
    \ \\\n  -m {model_path} \\\n  -md {draft_path} \\\n  --draft-max {k} \\\n  -t\
    \ {threads} \\\n  -n 100 \\\n  --temp {temperature}\n"
  moe_expert_reduction: "numactl --interleave=all \\\n  /mnt/raid0/llm/llama.cpp/build/bin/llama-completion\
    \ \\\n  -m {model_path} \\\n  --override-kv {override_key}=int:{experts} \\\n\
    \  -t {threads} \\\n  -n 100 \\\n  --temp {temperature}\n"
  prompt_lookup: "numactl --interleave=all \\\n  /mnt/raid0/llm/llama.cpp/build/bin/llama-lookup\
    \ \\\n  -m {model_path} \\\n  --draft-max {k} \\\n  -t {threads} \\\n  -n 100\
    \ \\\n  --temp {temperature}\n"
  baseline: "numactl --interleave=all \\\n  /mnt/raid0/llm/llama.cpp/build/bin/llama-completion\
    \ \\\n  -m {model_path} \\\n  -t {threads} \\\n  -n 100 \\\n  --temp {temperature}\n"
  vision: "numactl --interleave=all \\\n  /mnt/raid0/llm/llama.cpp/build/bin/llama-mtmd-cli\
    \ \\\n  -m {model_path} \\\n  --mmproj {mmproj_path} \\\n  -t {threads}\n"
  server_start: "numactl --interleave=all \\\n  /mnt/raid0/llm/llama.cpp/build/bin/llama-server\
    \ \\\n  -m {model_path} \\\n  -t {threads} \\\n  --host 127.0.0.1 \\\n  --port\
    \ {port} \\\n  -c {context_length}\n"
  server_start_moe: "numactl --interleave=all \\\n  /mnt/raid0/llm/llama.cpp/build/bin/llama-server\
    \ \\\n  -m {model_path} \\\n  -t {threads} \\\n  --host 127.0.0.1 \\\n  --port\
    \ {port} \\\n  -c {context_length} \\\n  --override-kv {override_key}=int:{experts}\n"
runtime_quirks:
  qwen25_coder_32b_instruct:
    description: Qwen2.5-Coder-32B-Instruct
    quirks:
    - issue: llama-speculative errors with 'invalid argument:' when wrapped in timeout
      workaround: Run without timeout wrapper, or use llama-cli instead
      discovered: 2025-12-16
    - issue: Low speculative decoding acceptance rate (~16%)
      workaround: Use MoE models instead for high throughput
      discovered: 2025-12-16
    - issue: Baseline generation very slow (7 t/s) on CPU
      workaround: Not recommended for high-throughput tasks - use Qwen3-Coder-30B-A3B
        instead
      discovered: 2025-12-16
  qwen3_coder_30b_a3b:
    description: Qwen3-Coder-30B-A3B-Instruct
    quirks:
    - issue: Requires MoE expert override key specific to architecture
      workaround: Use --override-kv qwen3moe.expert_used_count=int:4
      discovered: 2025-12-16
  qwen3_coder_53b_a3b:
    description: Qwen3-Coder-53B-A3B-Instruct-TOTAL-RECALL-v2
    quirks:
    - issue: Larger model, slower than 30B variant despite similar quality
      workaround: Use for complex tasks only, prefer 30B for standard coding
      discovered: 2025-12-16
  qwen3_coder_480b:
    description: Qwen3-Coder-480B-A35B-Instruct
    quirks:
    - issue: BOS token mismatch - standard drafts incompatible
      solution: jukofyork vocab transplant draft (draft_qwen3_coder_0_75b) — BOS matched (comma token 11)
      status: VERIFIED WORKING (2026-02-13) — 74-82% acceptance, 2.16x speedup
      discovered: 2025-12-15
      updated: 2026-02-13
    - issue: Prompt lookup net-negative despite working mechanically
      details: 18.4% acceptance on refactoring, but -34% speed due to MoE verification overhead
      workaround: Use spec decode instead (74% acceptance, +2.16x speed)
      discovered: 2026-02-13
    - issue: MOE2 (2 experts) produces garbage output despite being faster
      workaround: Use MOE3 (3 experts) - 10.30 t/s with good quality (+58% speedup)
      discovered: 2025-12-21
      explanation: "With parallel repack enabled (no OMP_NUM_THREADS=1):\n- Baseline:\
        \ 6.53 t/s (good output)\n- MOE3: 10.30 t/s (+58% speedup, good output) \u2713\
        \ OPTIMAL\n- MOE4: 9.25 t/s (+42% speedup, good output) \u2713 Safe fallback\n\
        - MOE5: 8.50 t/s (+30% speedup, good output)\n- MOE2: 11.51 t/s (+76% speedup,\
        \ GARBAGE output) \u2717 UNUSABLE\nThe 480B model needs at least 3 experts\
        \ for coherent output.\n"
  qwen3_thinking_models:
    description: Qwen3-*-Thinking-2507 models (unsloth fine-tunes)
    quirks:
    - issue: Missing BOS token metadata in GGUF prevents speculative decoding
      workaround: Use MoE expert reduction only (no spec decode)
      discovered: 2026-01-12
      explanation: >
        The Qwen3-Thinking-2507 models from unsloth have tokenizer.ggml.eos_token_id
        but no tokenizer.ggml.bos_token_id in their GGUF metadata. Since all draft
        models have BOS tokens defined, llama.cpp speculative decoding fails with
        "draft model special tokens must match target model to use speculation".
        MoE expert reduction still works normally for these models.
  qwen2_vs_qwen2_5:
    description: Qwen2 and Qwen2.5 tokenizer incompatibility
    quirks:
    - issue: Qwen2 drafts crash with Qwen2.5 targets (vocab mismatch)
      workaround: Use Qwen2.5 drafts only (draft_qwen25, draft_qwen25_coder)
      discovered: 2026-01-09
      explanation: |
        Qwen2: vocab_size=151,936, eos=151643
        Qwen2.5: vocab_size=152,064, eos=151645
        The 128 token difference causes crashes when target generates token ID >= 151,936.
  qwen2_5_72b:
    description: Qwen2.5-72B-Instruct and Qwen2.5-Math-72B
    quirks:
    - issue: Speculative decoding shows ~2% acceptance with ALL tested draft models
      workaround: Do not use speculative decoding - use baseline or prompt lookup
        only
      discovered: 2025-12-31
      explanation: 'Tested draft models (all showed ~2% acceptance):

        - Qwen2.5-Coder-0.5B (2.4%)

        - Qwen2.5-Coder-1.5B Q4_K_M (2.4%)

        - Qwen2.5-Coder-1.5B Q2_K (2.2%)

        - Qwen2.5-0.5B base (2.3%)

        - Qwen2.5-Math-1.5B (2.3%)

        - Qwen2.5-Math-1.5B Q6K (2.3%)

        All Qwen2.5 variants share the same tokenizer, so this is not a vocab mismatch.

        Root cause unclear - possibly generation pattern differences in 72B models.

        For comparison: Qwen2.5-Coder-32B achieves 11x speedup with the same drafts.

        '
  minimax_m21:
    description: MiniMax M2.1 (230B MoE, 256 experts, 8 active)
    quirks:
    - issue: Chat template requires Jinja engine
      workaround: Always use --jinja flag
      discovered: 2026-01-19
    - issue: llama-cli enters interactive mode by default
      workaround: Use llama-completion instead of llama-cli for non-interactive use
      discovered: 2026-01-19
    - issue: Model outputs <think> tags (reasoning model)
      workaround: Parse and strip tags for non-reasoning use, or let model reason
      discovered: 2026-01-19
    - issue: 256 experts causes sparse memory access patterns
      workaround: Expected speed ~9.5 t/s despite 10B active params (lower than Qwen3 MoE)
      discovered: 2026-01-19
    - issue: Split across 3-4 GGUF files depending on quant
      workaround: Point to first file (-00001-of-000XX), others auto-loaded
      discovered: 2026-01-19
    - issue: Unique vocab (200,064 tokens)
      workaround: No compatible draft model - speculative decoding NOT possible
      discovered: 2026-01-19
  glm_47_flash:
    description: GLM-4.7-Flash (30B MoE, 64 experts, 4 active, deepseek2 arch)
    quirks:
    - issue: Chat template requires Jinja engine
      workaround: Always use --jinja flag
      discovered: 2026-01-22
    - issue: llama-cli may enter interactive mode
      workaround: Use llama-completion for non-interactive use
      discovered: 2026-01-22
    - issue: Uses deepseek2 architecture with MLA (Multi-head Latent Attention)
      workaround: No speculative decoding support - MLA incompatible
      discovered: 2026-01-22
    - issue: Already uses 4 experts by default (optimal)
      workaround: No MoE reduction needed - already at minimum

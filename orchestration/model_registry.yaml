  three_stage_summarization:
    description: "Two-stage pipeline (Stage 0 compression DISABLED due to quality regression)"
    enabled: true
    threshold_tokens: 5000         # Minimum tokens to trigger (estimated from chars/4)
    multi_doc_discount: 0.7        # Lower threshold for multi-document tasks
    context_reduction_target: 0.15 # Stage 2 receives ~15% of original context
    # Stage roles inverted 2026-05-06 - better matches each model to its stage's
    # demand profile. Pre-2026-05-06: stage1=frontdoor, stage2=ingest_long_context.
    # Rationale per long_context bench (May 4-6):
    #   - Stage 1 demand: SPEED at full long context (every token costs).
    #     Qwen3-Next-80B's SSM-hybrid linear attention scales O(n) per token,
    #     beating Qwen3.6-35B-A3B's pure-attention scaling at extreme contexts.
    #     Bench: ingest 14.4-20.8 t/s @ 12K vs frontdoor 6.5-16.6 t/s.
    #   - Stage 2 demand: QUALITY on reduced context (~15% of original ~= 7-8K).
    #     Qwen3.6-35B-A3B Q8 scored 27/27 (100%) on long_context suite vs
    #     Qwen3-Next-80B's 25/27 (93%). At 7-8K context, frontdoor's lower
    #     long-context throughput is acceptable for the quality-review pass.
    # Architectural diversity preserved: SSM-hybrid (stage 1) + MoE-attention
    # (stage 2). Three_stage_summarization design intent unchanged.
    stage1_role: ingest_long_context  # SSM-hybrid linear attention; fast draft on full context
    stage2_role: frontdoor             # Higher quality review on reduced context (~15%)
    compression:  # Stage 0: LLMLingua-2 extractive compression
      enabled: false               # DISABLED - causes quality regression

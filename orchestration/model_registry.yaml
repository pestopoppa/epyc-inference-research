    candidate_roles:
    - architect
    - general
    - coder
    - thinking
    acceleration:
      type: speculative_decoding
      spec_type: draft-mtp  # 2026-06-26 v6 cutover: native draft-mtp on production-consolidated-v6 (was 'mtp', ik_llama deprecated)
      draft_role: draft_gemma4_31b_assistant_q8

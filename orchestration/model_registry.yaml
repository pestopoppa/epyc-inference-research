        temperature: 1.0
        top_p: 0.95
        top_k: 64
        repeat_penalty: 1.05
      max_context: 16384  # 2026-05-07: was 256000 (model's native cap), reduced for bench. Allocating
                          # ~31 GB of q8_0 KV cache for 256K ctx caused 5× per-token slowdown (4 t/s
                          # observed vs 21 t/s registered). At c=16384 KV is ~2 GB, plenty for the
                          # benchmark's ~4-15K token prompts. Deep-dive's 21 t/s measurement used c=4096.

  # Ant Group inclusionAI Lightning Attention + softmax MoE hybrid (16 of 20 layers linear, 4 softmax).
  # NEW ARCHITECTURE TAG: bailingmoe-linear (LLM_ARCH_BAILINGMOE_LINEAR added in
  # llama.cpp-experimental commit 33b60b925 + GroupRMSNorm fix in c9626faf8 on
  # branch feature/lightning-attention-port; required for these to load).
  # Decode SOTA-class reasoning per AIME 2025 spot-check (correct answer on Problem 1 = 70).
  # Tokenizer: bailingmoe2 (vocab 157184, distinct from Qwen — drafter-incompat with Qwen3-family targets).
  ring_mini_linear_q4km:
    tier: C
    description: Ring-mini-linear-2.0 Q4_K_M — Ant Group Lightning Attention hybrid, 16B/957M-active
    model:
      name: Ring-mini-linear-2.0
      path: /mnt/raid0/llm/hf_models/Ring-mini-linear-2.0/Ring-mini-linear-2.0-Q4_K_M.gguf
      huggingface_id: inclusionAI/Ring-mini-linear-2.0
      quant: Q4_K_M
      size_gb: 9.55
      architecture: bailingmoe-linear  # NEW: requires feature/lightning-attention-port branch in experimental fork
      use_chat_api: true
      chat_template: null  # ships custom Jinja in tokenizer_config.json — must launch with --jinja
      reasoning: auto  # native <think>...</think> reasoning format
      # FULL FIX FOR STUCK-IN-THINK FAILURE MODE 2026-05-04 (see research/deep-dives/
      # ring-mini-stuck-in-think-failure-mode.md). The Jinja template emits `<think>\n` at
      # the assistant turn; on multi-constraint enumeration problems Lightning Attention
      # loses early-context recall, the model cannot close the think block, and decode runs
      # to budget exhaustion (4096 tokens / ~52s) with the harness then stripping the
      # unclosed think trace → empty response. Setting reasoning_budget=0 makes llama-server
      # inject `</think>` immediately after the template's `<think>` open, forcing the model
      # to skip deliberation and answer directly. This trades reasoning depth (some quality
      # loss expected on AIME-class problems) for reliability (no more empties on enumeration
      # tasks). The model still gets to think internally during decode of the answer; it
      # just can't emit a multi-thousand-token externalized think trace.
      reasoning_budget: 0
      max_tokens_multiplier: 2  # 2× suite default (8K tokens). With reasoning_budget=0 the
      # model no longer fills budget with rumination; 2× is comfortable headroom for direct
      # answers. Could be reduced back to 1× once the budget=0 fix is empirically confirmed.
      env_vars:
        OMP_PROC_BIND: spread
        OMP_PLACES: cores
        OMP_WAIT_POLICY: active
        OMP_DYNAMIC: "false"
      kv_cache:
        type_k: f16  # state recurrence in F32 internally; KV-quant interaction with linear-attn drift untested
        type_v: f16
      sampling:
        non_thinking: null  # always emits <think> — no non-thinking sampling profile
        thinking:
          temperature: 0.7
          top_p: 0.95
          top_k: 40
          min_p: 0.0
      max_context: 131072  # native 131K
      max_output_tokens: 8192
      tokenizer: bailingmoe2  # distinct from qwen — no cross-tokenizer drafter compat
      n_layer: 20  # 16 linear-attention + 4 softmax (every 5th layer = softmax: indices 4,9,14,19)
      n_embd: 2048
      n_head: 16
      n_head_kv: 4  # softmax-layer GQA factor; linear layers use MHA
      head_dim: 128
      n_expert: 256
      n_expert_used: 8
      n_expert_shared: 1
      partial_rotary_factor: 0.5  # NeoX RoPE on first 64 of 128 head_dim
    candidate_roles:
    - worker          # standalone reasoning model for non-latency-critical queries
    - try_cheap_first  # 957M active is small, but linear-attn recurrence sequential at decode
    - q_scorer        # routing classifier replacement (per-request, throughput doesn't matter)
    acceleration:
      type: none  # tokenizer mismatch with Qwen-family targets precludes drafter use; same-family Ring-flash drafter relationship untested
      ngram_tested: false
      notes: |
        Drafter-for-Qwen-Coder NO-GO: (a) tokenizer mismatch (bailingmoe2 ≠ qwen2),
        (b) drafter throughput 25 ms/tok > target 16.7 ms/tok ratio = 1.5 — even if
        tokenizers matched, K=4 spec-dec would need E[accepted] > 7 (impossible).
        Natural drafter relationship is for Ring-flash-linear-2.0 (104B/6.1B-active,
        same tokenizer, 1:7 ratio) — UNTESTED, requires Ring-flash download.
    memory:
      residency: cold
      pinned: false
    generation_defaults:
      n_tokens: -1
      temperature: 0.7
    performance:
      baseline_tps: 40.68  # tg8 single-instance, 96t, fa=1, mmap=0, taskset 0-95 (no numa interleave on this run)
      optimized_tps: null  # no canonical sweep yet
      pp512_tps: 858.4
      pp32k_tg128_combined_tps: 560.2
      quality_score: null  # AIME-25 spot-check correct on Problem 1 (n=1) — full eval pending
    benchmark_date: 2026-04-30
    notes: >
      First model running on the new bailingmoe-linear architecture. Requires the
      feature/lightning-attention-port branch in /mnt/raid0/llm/llama.cpp-experimental
      (HEAD c9626faf8 or descendant). Compile with `cmake -B build_lightning -DGGML_CUDA=OFF
      -DGGML_NATIVE=ON`. Launch with `--jinja` for the custom Bailing chat template.
      AIME 2025 Problem 1 spot-check verified correct answer (70) with full reasoning
      chain. Paper claims AIME-25 73.65% / GPQA-D 65.69% — full benchmark pending.
      No published RULER/NIAH/LongBench numbers (tier-2b yellow flag). Long-context
      retrieval claims are paper-untested.
      Linear-attention recurrence is sequential at decode — small hidden_size (2048)
      underutilizes 96 threads. Q-scorer / standalone reasoning is the natural fit;
      drafter use is NOT viable for Qwen-family targets (see acceleration.notes).


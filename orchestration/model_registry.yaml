    description: Ring-mini-linear-2.0 — Ant Group Lightning Attention hybrid (NEW arch)
    quirks:
    - issue: Custom Bailing Jinja chat template not in built-in list
      workaround: Launch with --jinja (executor.py adds this when use_chat_api=true). Without it llama-server aborts with "this custom template is not supported".
      discovered: 2026-04-30
    - issue: New architecture (LLM_ARCH_BAILINGMOE_LINEAR / "bailingmoe-linear")
      workaround: Requires kernel commit c9626faf8+ on production-consolidated-v5 (or descendant). Pre-c9626faf8 builds fail to load with "unknown architecture" error.
      discovered: 2026-04-30
    - issue: No compatible draft model for speculative decoding
      workaround: bailingmoe2 tokenizer (vocab 157184) ≠ qwen2 (151936). Cross-tokenizer spec-dec is research-stage; same-family Ring-flash-linear-2.0 drafter relationship untested.
      discovered: 2026-04-30
    - issue: Linear-attention recurrence is sequential at decode (no batching across time)
      workaround: Decode at 40 t/s on Q4_K_M is bandwidth/sequence-bound, not compute-bound. Multi-instance NUMA shards may help aggregate throughput; not benchmarked.
      discovered: 2026-04-30
    - issue: Always emits <think>...</think> blocks (reasoning model — no non-thinking variant)
      workaround: Set reasoning=auto (default) and reasoning_budget=4096 to control reasoning trace length. For latency-sensitive use, set reasoning=off to suppress think emission.
      discovered: 2026-04-30
    - issue: GroupRMSNorm (group_norm_size=4) on linear-attn output is non-standard
      workaround: Implemented in llama.cpp via reshape→ggml_rms_norm→reshape (NOT ggml_group_norm which is LayerNorm semantics). v1 commit 33b60b925 had a bug; fix in c9626faf8 (factual queries survive bug, multi-step reasoning collapses without fix). If reasoning quality regresses on a future kernel, audit ring-linear.cpp for accidental ggml_group_norm reintroduction.
      discovered: 2026-04-30


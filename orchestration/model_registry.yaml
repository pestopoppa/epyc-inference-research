speculative_decoding_policy:
  canonical: true
  ratified_by: operator
  ratified_on: 2026-07-31
  amended_on: 2026-10-03
  amended_by_receipt: RATIFY-STACKCHG-DFLASH2-20261003
  supersedes: 'All prior per-role prose describing `draft-mtp` alone as the production recipe, and the `ngram_candidate_spec_type` field (RETIRED — see below).

    '
  default_spec_type: draft-mtp
  statement: 'No n-gram composition: a role that speculates runs ONE drafter, never `ngram-mod,<drafter>`. WHICH drafter is a per-model list here (`roles.<model_role>.drafters`) and a per-server selection
    in the orchestrator''s stack_topology.yaml (`drafter_selection`). Legacy rows without `drafters` still hand-carry `spec_type: draft-mtp` until migrated.

    '
  superseded_recipe: 'REVERSED 2026-07-31 (same day it was adopted). The composed recipe `ngram-mod,draft-mtp` was adopted on the expectation of a large upside on repetitive / token-reuse context, with
    a measured -1.6% cost on ordinary text accepted in exchange. The long-context coding test that was supposed to demonstrate that upside instead falsified it, and the exception case was falsified independently.
    The trade was made with eyes open and is now unmade on evidence.

    '
  evidence_for_reversal:
    long_context_coding_35b: 'Qwen3.6-35B-A3B Q8, 12 matched prompts at 15k-28k context (extend / port / fill-in-the-middle / prose). Composed won 0 of 12. Mean -4.06% against the first draft-mtp baseline
      and -8.24% against a second replicate of the SAME baseline config. Mechanism is in the counters: composed drafts MORE and accepts LESS (extend_3: 518 -> 708 drafts, acceptance 0.734 -> 0.540). Each
      rejected draft costs a full verification pass.

      '
    long_context_coding_gemma: 'gemma-4-26B-A4B Q4_K_M, same 12 prompts. Mean -0.04%. The real result is structural, not numeric: n-gram produced ZERO drafts on 9 of 12 prompts — those arms are byte-identical
      in acceptance, draft count and tok/s. Coding output does not contain n-grams repeated from its context. Where it did fire (the 3 fill-in-the-middle prompts) acceptance fell from 0.78/0.84/0.78 to
      0.67/0.68/0.62.

      '
    ordinary_text: '-1.6% mean on non-repetitive prose/code. Independent distinct-prompt re-run (ngramfix): -4.2% to +1.3% composed vs draft-mtp; n-gram ALONE costs 23-31%.

      '
    retracted_positive: 'The 2.80x that originally motivated composed was RETRACTED — a warm-context self-copy artifact from repeating one prompt, so the model copied its own prior answer (mean accepted
      length 3.58 -> 15.88, acceptance -> 1.000).

      '
    harness_caveat: 'The 35B coding run executed its arms sequentially and its two same-config replicates differ by +4.17% (11/11 consistent), i.e. monotonic host drift over the ~2h window. DIRECTION survives
      — composed loses against both the early and the late baseline, 0/12 and 0/11 — but quoted MAGNITUDES are soft.

      '
  where_ngram_does_win: 'TASK-CLASS SCOPED, not a default. Composed wins only where the OUTPUT repeats itself or repeats the input verbatim, AND verification is cheap (small active parameter count). Measured
    on fresh servers: gemma-4-26B-A4B Q4_K_M on a repetitive strict-JSON tool_call, 143.58 -> 330.57 t/s (2.30x); Qwen3.5-9B Q4_K_M generating 1024 literal repetitions of one word, 114.81 -> 466.47 t/s
    (4.06x). The SAME gemma fixture on a non-repetitive coding explanation (harness-verified repeated_5grams = 0) gave +0.07% — a dead wash — and the n-gram arm FAILED a quality check the draft-mtp arm
    passed. Large models lose outright: Qwen3-Coder-480B refactoring -34% at 18.4% acceptance. Re-enabling composed for a specific role requires measuring THAT role''s real traffic, not a synthetic repetitive
    fixture.

    '
  exceptions:
    ingest_long_context:
      status: closed
      closed_on: 2026-10-03
      model: Qwen3-Next-80B-A3B-Instruct
      spec_type: none
      category: OPTIMUM
      reason: 'Qwen3-Next-80B is an SSM/MoE hybrid. Its recurrent state cannot fork, so NO external draft-model path exists and none can be built. n-gram alone yields 1.6-4.7% acceptance, i.e. nothing.
        `--spec-type none` is therefore the BEST AVAILABLE configuration for this model — it is this model''s OPTIMUM and BELONGS IN HEADLINE TABLES. It is emphatically NOT a baseline and must never be
        excluded from a headline on the grounds that "speculation is off". That exact mistake was made on 2026-07-31.

        '
  measurement_categories:
    BASELINE: 'An optimization the model HAS, deliberately switched OFF. Diagnostic only. Belongs in an addendum. NEVER a headline number. NEVER a comparison arm in a promotion decision. A BASELINE regression
      does NOT block a promotion; a BASELINE improvement is NOT a promotion argument.

      '
    OPTIMUM: 'The best configuration AVAILABLE for that model. If a model has no draft path, running it with `--spec-type none` IS its OPTIMUM (see ingest_long_context above) — that is not a baseline and
      it belongs in headline tables. Promotion decisions are made between OPTIMUM configs and nothing else.

      '
    CANDIDATE: 'Measured but NOT adopted. Must be labelled as such so it is never mistaken for what production runs.

      '
  promotion_rule: 'Promotion is decided on the production-OPTIMAL configuration alone. A regression in a BASELINE-category measurement is not a promotion blocker and must not be cited as one. See MEASUREMENT.md
    / agents/shared/MEASUREMENT_POLICY.md for the ratified constitution-level wording.

    '
  effective_only_after: 'scripts/registry/stack_change_pipeline.py must regenerate orchestration/derived/stack_priors.yaml before a registry spec_type change reaches a launched server. A master-registry
    edit alone does NOT change production behaviour.

    '
  runtime_switchability:
    launch_fixed:
      spec_type: 'LAUNCH-ONLY. `--spec-type` (common/arg.cpp:3934-3946) appends to `params.speculative.types` at server start. Which drafters are active — and therefore whether the n-gram lane is composed
        in at all — is fixed for the life of the process. The per-request `speculative.type` field IS registered in the server schema (tools/server/server-schema.cpp:220-224) but sits inside `#if 0` (opened
        at :210, closed at :234) under the upstream comment at :209 — "disable speculative parameter adjustments that are not wired per request". It is NOT compiled into the production binary. Autopilot
        CANNOT switch drafter per request.

        '
      draft_model: 'LAUNCH-ONLY. `--spec-draft-model` / `-md` / `--model-draft` (common/arg.cpp:3927). No per-request equivalent exists in any compiled path.

        '
      ngram_composition: 'LAUNCH-ONLY, and NOT selectively disableable. The ngram lanes are configured exclusively by launch flags: `--spec-ngram-mod-n-min` / `-n-max` / `-n-match` (common/arg.cpp:3945-3973),
        `--spec-ngram-simple-size-n` / `-size-m` / `-min-hits` (:3976-4004), `--spec-ngram-map-k-*` (:4007+). Their per-request counterparts (`speculative.ngram_size_n` / `_size_m` / `_min_hits`, server-schema.cpp:226-233)
        are inside the same `#if 0`. Consequence: a request cannot turn ngram off while leaving draft-mtp on — under a composed launch the only per-request lever is the shared draft budget, which kills
        BOTH arms together. Selective ngram requires SEPARATE SERVER INSTANCES.

        '
      draft_n_min_and_p_min: 'LAUNCH-ONLY. `--spec-draft-n-min` (common/arg.cpp:3868) and `--spec-draft-p-min` (:3883). The per-request `speculative.n_min` and `speculative.p_min` fields (server-schema.cpp:211-218)
        are inside the `#if 0` and are not compiled in.

        '
    per_request:
      speculative.n_max: "LIVE IN v9, AND LOWER-ONLY. `speculative.n_max` is registered OUTSIDE the `#if 0` (tools/server/server-schema.cpp:205-207, hard limits 0..INT32_MAX, \"0 disables speculation for\
        \ the request\"). Post-processing then clamps it to the launch value — server-schema.cpp:542-547:\n  \"Per-request speculation may only reduce the launch-time budget. The\n   server sizes its output\
        \ buffers from the launch parameters, so report\n   the clamped value that will actually be used by the slot.\"\n  params.speculative.draft.n_max = std::min(\n          params.speculative.draft.n_max,\n\
        \          params_base.speculative.draft.n_max);\nThe slot applies it with a second min at server-context.cpp:437. So a request may LOWER the draft budget (down to 0 = no speculation for that request)\
        \ but can NEVER raise it above the `--spec-draft-n-max` the server was launched with. Any autopilot search over n_max is therefore bounded ABOVE by the launch value and needs a relaunch to explore\
        \ higher. NOTE the separate hazard recorded in SR-3 of epyc-root/handoffs/active/speculative-decoding-mtp-refresh.md: under a COMPOSED recipe `n_max` is a soft budget, not a cap — measured mean\
        \ accepted run length 2.36-2.67 at n_max=2 — because the ngram lane has its own independent `--spec-ngram-mod-n-max`.\n"
    v8_claim_corrected: 'A 2026-07-31 source read of v8 (`67a433bf4`) concluded that the ENTIRE per-request speculative surface was compiled out, `speculative.n_max` included. That was true of v8 and is
      FALSE of v9: at 0db32c06e3e550065b78311a6031ef3dd2c4f27c the `#if 0` opens at :210, i.e. BELOW the `speculative.n_max` registration at :205, and the :542-547 clamp exists specifically to bound the
      newly-live field. Do not carry the v8 claim forward. Any statement about this surface must name the kernel commit it was read at.

      '
    autopilot_implication: 'A per-request drafting policy is possible on v9 only in the LOWER direction and only for the shared budget: skip or shorten drafting for a request, never lengthen it, and never
      per-lane. Everything else — which drafters, which draft model, the ngram parameters, n_min, p_min — is a RELAUNCH, and raising the ceiling above the launch budget is a relaunch too. Enabling the `#if
      0` block would be a KERNEL CHANGE: it must ride the full experimental -> validate -> new-production cycle in CLAUDE.md, never a patch to a frozen production tree.

      '
  retired_fields:
    ngram_candidate_spec_type: 'RETIRED 2026-07-31. This field previously carried `ngram-mod,draft-mtp` while `spec_type` carried `draft-mtp`, which read as "the real one is elsewhere" and directly caused
      mis-launched measurement runs. The composed recipe is now the value of `spec_type` itself. Any surviving occurrence of this key is stale and MUST be deleted, not consulted.

      '

  # --- MiniMax M2.7 (2026-04-17) ---
  minimax_m27_q8:
    tier: A
    description: MiniMax-M2.7 Q8_0 — architect replacement candidate, MoE 230B-A10B, 256 experts
    model:
      name: MiniMax-M2.7
      path: /mnt/raid0/llm/models/MiniMax-M2.7-GGUF/Q8_0/MiniMax-M2.7-Q8_0-00001-of-00006.gguf
      quant: Q8_0
      size_gb: 227
      architecture: minimax-m2
      use_chat_api: true  # instruction-tuned, needs chat template + --jinja for proper formatting
      # ⚠️ WARNING: disable_thinking flag is SENT BUT IGNORED by this model.
      # Empirically confirmed 2026-05-04: 14 of 15 empty responses on May 4 full sweep had
      # `completion_tokens=16384` (max budget hit) + entirely-in-`<think>` block that never
      # closes, despite chat_template_kwargs {"enable_thinking": false} being sent.
      # MiniMax upstream documentation explicitly states "thinking CANNOT be disabled" — this
      # registry flag exists for symmetry with other models but does not actually suppress think.
      # The 6/10 empty rate on the coder suite stems from this: model opens <think>, ruminates
      # to budget exhaustion, never emits answer. Workaround NOT available without a server-side
      # template patch. Keep as architect_general only (drop architect_coding).
      disable_thinking: true
      reasoning: auto  # upstream handles thinking properly; was "off" on our fork
      max_tokens_multiplier: 4  # thinking model: needs 4x token budget for reasoning + answer
      timeout_multiplier_min: 4.0  # interleaved-thinking can fill 8-16K tokens at ~11 t/s; auto speed-multiplier (1.8×) is insufficient. With max_tokens_multiplier coupling: effective ~4× × 4 = 16× the suite-base timeout, ~48 min/question worst-case headroom.
      env_vars:
        OMP_PROC_BIND: spread
        OMP_PLACES: cores
        OMP_WAIT_POLICY: active
        OMP_DYNAMIC: "false"
      kv_cache:
        type_k: q8_0  # recommended by unsloth (default f16 degrades MoE quality)
        type_v: q8_0  # q6_0 not supported in our build; q8_0 is next best
      sampling:  # HuggingFace model card recommended (2026-04-23)
        temperature: 1.0
        top_p: 0.95
        top_k: 40
        min_p: 0.01  # from Unsloth llama-server example
      thinking_caveat: >
        MiniMax officially states thinking CANNOT be disabled. Our executor forces
        enable_thinking=false via chat_template_kwargs — this works for benchmarking
        but may degrade quality. Chat parser crashes on mixed-language reasoning output
        when thinking is enabled (v4 regression). Interleaved thinking model: thinks
        between tool calls, not just at start.
      baseline_experts: 8
      total_experts: 256
      active_params: 10B
      total_params: 230B
      vocab_size: 200064
      max_context: 196608
    candidate_roles:
    - architect_general  # architect_coding REMOVED 2026-05-04: 60% empty rate on coder suite
                         # disqualifies the model for code-generation. May 4 scoring (135/183
                         # full sweep) showed 6/10 empty on coder vs 1/30 empties across the
                         # other 5 suites combined. Excluded-coder score = 124/153 = 81%.
                         # See SCORING_SUMMARY_2026-05-04.md.
    acceleration:
      type: none  # ngram zero effect (sweep-verified 2026-04-17)
      ngram_tested: true
    constraints:
      forbid:
      - speculative_decoding
      reason: 200K vocab — no compatible draft model exists
    performance:
      baseline_tps: 11.1
      optimized_tps: 11.1
      dual_per_inst_tps: 5.3
      dual_aggregate_tps: 9.5  # worse than single
    memory:
      residency: cold
      pinned: false
    benchmark_date: 2026-04-17
    notes: >
      Architect replacement candidate: 11.1 tps vs architect_general 9.14 (1.2x), architect_coding 3.79 (2.9x).
      Q4_K_XL deleted — Q8 preferred for quality. Multi-instance not viable at 227GB.
      M2.7 scored 56.22% SWE-Pro. Quality eval (G9) pending.
      HuggingFace sampling: temp=1.0, top_p=0.95, top_k=40, min_p=0.01.
      MUST preserve <think> blocks in conversation history. Interleaved thinking model.
      v4 chat parser crashes on thinking=ON (mixed Chinese/English reasoning) — benchmark with thinking OFF.


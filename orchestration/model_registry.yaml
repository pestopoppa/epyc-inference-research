      cannot predict MoE expert routing reliably, AND each accepted draft token requires distinct
      expert weight loads on the verifier, eroding the bandwidth savings that make MTP win on dense.
      Tier X (eval-only) — does not displace existing Coder-30B-A3B coder role (49.1 t/s).
      Drafter GGUF was converted in-house from google/gemma-4-26B-A4B-it-assistant safetensors
      because no community GGUF existed. See deep-dives/gemma4-mtp-drafter-deep-dive.md.


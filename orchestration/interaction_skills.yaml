interaction_skills:
  # architect_critic — SERVED BY Qwen3.8-27B Q8 on the MI210 (ROCm0), port 8083,
  # tier hot, since the 2026-09-27 ARCHITECT SWAP (operator-decided). The skill
  # stays with the ROLE (identity), so critique_plan now runs on the 27B, the same
  # process that hosts coder_escalation / ingest_long_context. Before the swap this
  # role was the CPU :8074 process (Qwen3.5-122B-A10B UD-Q4_K_M when the notes
  # below were written; Qwen3.8-Flash-Next UD-IQ4_XS 2026-09-22 → 2026-09-27),
  # which now serves architect_general. The tier-hot and THROUGHPUT notes below
  # describe that 122B CPU process and are NOT re-attributable to the 27B.
  #
  # CORRECTED 2026-07-31: an earlier version of this comment said architect_critic
  # was "deliberately NOT a routed role". That was wrong. It is BOTH consultable
  # and ROUTABLE:
  #   - consultable via this skill, requested by architect_general or the autopilot
  #     planner cycle for specific deep-reasoning tasks;
  #   - routable as a normal escalation target in specific circumstances (operator's
  #     example: "boosted reasoning");
  #   - and it MUST be a selectable arm in autopilot's search space. An arm autopilot
  #     cannot see is an arm it can never learn the value of.
  #
  # tier hot is deliberate: the 122B holds 69 GB standing, and the operator accepted
  # that cost explicitly ("it costs us very little"), with the worst case being that
  # it is rarely selected.
  #
  # THROUGHPUT (category=OPTIMUM, full instance, canonical placement, draft-mtp):
  #   24.00 tok/s short context, 15.76 tok/s long context.
  # So a 600-token critique is ~25 s short-context, ~38 s long-context.
  # An earlier version of this comment said "roughly 8 t/s ... ~75 s". That was wrong:
  # 8.21 is a Qwen3-235B-A22B figure that had been left unlabelled in
  # architect_general's performance block since before the 2026-03-19 model swap
  # (quarantined under superseded_model_history in the master registry on 2026-07-31).
  #
  # NOTE ON max_queue_wait_ms / max_output_tokens: the long queue wait is
  # deliberate — this is a considered consult, not an inline check like
  # architect_general.review_before_commit (400 tokens, 2 s wait).
  architect_critic:
    critique_plan:
      kind: consult
      description: >
        Adversarial review of a proposed plan before execution. Primary consumer
        is the autopilot planner cycle; architect_general may also request it for
        deep-reasoning tasks where a second opinion is worth the latency.
      output_schema:
        type: object
        required: [fatal_flaws, unstated_assumptions, should_not_build, verdict, confidence]
        properties:
          fatal_flaws:
            type: array
            description: Reasons this plan fails outright, not stylistic objections.
            items:
              type: string
          unstated_assumptions:
            type: array
            description: Things the plan takes for granted that have not been established.
            items:
              type: string
          should_not_build:
            type: array
            description: >
              THE DELETE LENS. Parts of the plan to cut, not fix. Required because
              an adversarial reviewer that can only ADD mechanism reliably makes
              plans bigger — every critique becomes another component. A critic
              with no authority to subtract is a complexity pump.
            items:
              type: string
          simpler_alternative:
            type:
              - string
              - "null"
            description: A materially smaller approach that achieves the same goal, or null.
          verdict:
            type: string
            enum: [proceed, proceed_with_changes, reconsider]
          confidence:
            type: number
            minimum: 0
            maximum: 1
        additionalProperties: false
      max_output_tokens: 600
      scheduler_defaults:
        priority: background
        workload_class: consult
        max_queue_wait_ms: 15000
        cancellable: true
      tools_budget: 0
      cache_ttl_seconds: 3600

  # architect_general — SERVED BY Qwen3.8-Flash-Next UD-IQ4_XS on the full CPU
  # instance (:8074, serial, whole-machine region-lock holder) since the
  # 2026-09-27 ARCHITECT SWAP; the MI210 27B (:8083) before it. The 2 s queue wait
  # below was sized for the 27B GPU process.
  architect_general:
    review_before_commit:
      kind: consult
      description: "Advisory review of a coder draft before it commits."
      output_schema:
        type: object
        required: [risks, blocking_issues, confidence, recommended_delta]
        properties:
          risks:
            type: array
            items:
              type: string
          blocking_issues:
            type: array
            items:
              type: string
          confidence:
            type: number
            minimum: 0
            maximum: 1
          recommended_delta:
            type: string
          do_not_do:
            type: array
            items:
              type: string
          needs_input:
            type:
              - string
              - "null"
        additionalProperties: false
      max_output_tokens: 400
      scheduler_defaults:
        priority: background
        workload_class: consult
        max_queue_wait_ms: 2000
        cancellable: true
      tools_budget: 0
      cache_ttl_seconds: 1800

# ── LB-2 per-decision token + latency budgets (ceilings) ────────────────────
# Consumed by the shadow budget hook (IterationContext.check_token_budget) when
# budget_shadow_logging_enabled flips on. All PROPOSED / observation-grade
# (derived as tokens ÷ t/s on the deciding arm, rounded up); confirm under
# P-AB-1 + P-SPEED-OBJ (LB-4) before any enforce-mode flip. restart_cost: none.
per_decision_budgets:
  plan_review:
    actor: architect        # ~18-21 t/s CPU
    token_budget: 350
    latency_budget_ms: 22000
    knob_names:
      - review_plane.plan_review_token_budget
      - review_plane.plan_review_latency_budget_ms
    note: one pass per plan; reminders-over-re-review preferred (intake-835)
    provenance: LB-2 table (proposed / observation-grade)
  candidate_review:
    actor: reviewer         # CPU GLM low t/s OR GPU-resident
    token_budget: 300
    latency_budget_ms: 18000        # CPU
    latency_budget_ms_gpu_resident: 6000
    knob_names:
      - review_plane.candidate_review_token_budget
      - review_plane.candidate_review_latency_budget_ms
    note: GBNF-constrained verdict; SUM-not-MAX if run parallel to production
    provenance: LB-2 table (proposed / observation-grade)
  rubric_authoring:
    actor: strong_model     # architect-tier
    token_budget: 800
    latency_budget_ms: 45000
    amortized: true         # authored once per task-type, sticky-cached (H3)
    knob_names:
      - review_plane.rubric_authoring_token_budget
      - review_plane.rubric_authoring_latency_budget_ms
    note: cost divided over all items it grades
    provenance: LB-2 table (proposed / observation-grade)
  rubric_grading:
    actor: cheap_grader     # worker ~44.7 t/s
    token_budget: 180
    latency_budget_ms: 5000
    knob_names:
      - review_plane.rubric_grading_token_budget
      - review_plane.rubric_grading_latency_budget_ms
    note: high-frequency per-item path; grading-model insensitivity 2.4pp (intake-834)
    provenance: LB-2 table (proposed / observation-grade)

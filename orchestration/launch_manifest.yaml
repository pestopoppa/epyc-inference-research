# =============================================================================
# LAUNCH MANIFEST — the launcher's declared input
# =============================================================================
#
# Everything the launcher needs to know about WHAT to launch and WHERE. Until
# 2026-08-01 this lived as Python literals in scripts/server/stack_manifest.py;
# that module is now a thin loader over this file and exports the same names
# with the same types.
#
# WHY THIS FILE EXISTS. The audit that produced it found that nearly every
# severe launcher finding had the same shape: the compiled artifact was CORRECT
# and something else won anyway — a `--device none` hardcoded over a declared
# `device: ROCm0` (a 27B ran on CPU with the GPU at 0%), a `slots: 2` mode
# literal shadowing a declared `slots: 1`, a probe list hitting seven dead ports
# while missing a live one. Those local copies existed BECAUSE the manifest was
# code: a Python table invites a second Python table beside it, and a fallback
# dict is one `try/except ImportError` away. Data does not invite that.
#
# PHASE STATUS. Phase 1 was EXTRACTION ONLY (Python literals -> this file).
# Phase 2 (2026-08-02) stops RESTATING what the master registry already declares:
#
#   DERIVED from orchestration/model_registry.yaml `server_mode` (no longer
#   declared here at all — stack_manifest.py reads master):
#     * slots        -> server_mode.<role>.slots      (drives -np)
#     * device       -> server_mode.<role>.device     (vision worker)
#     * shared_with  -> server_mode.<role>.shared_with (role aliases)
#
#   STILL DECLARED HERE, because master has no counterpart for most rows, but
#   now covered by the import-time parity guard `validate_declaration_parity()`
#   so the rows that DO exist in both can never drift:
#     * port, tier, kv_quant, n_ctx, and the numa_ports/numa_instances
#       projection of stack_topology.yaml
#
# HOW TO CHANGE IT. Edit the data. Do not add a fallback table in a consumer;
# a consumer that cannot load this file must fail, not guess. Two import-time
# validators in stack_manifest.py fail loudly at process start rather than at
# launch time:
#   `_validate_role_classification()`  — this file vs stack_topology.yaml
#   `validate_declaration_parity()`    — this file vs the MASTER registry
# -----------------------------------------------------------------------------
schema_version: launch_manifest.v1

# Path placeholders expanded at load time from scripts/server/stack_paths._PATHS
# (which itself reads src/config). Expansion is a literal substring replacement,
# so a value containing braces for any other reason is left alone.
#   {models_dir} {model_base} {project_root} {cache_dir} {llm_root} {tmp_dir}


# =============================================================================
# Port assignments by role (primary ports — full-speed 1×96t instances)
# Pre-warm (2026-03-29): primary port is the full-speed instance.
# Sub-full instances on offset ports: since the 2026-07-30 half-fleet cutover
# these are the two HALVES 8080/8180 (2x48t); the 8280/8380 quarters are retired.
# =============================================================================
# KEPT (phase 2, option b): master declares `server_mode.<role>.port` for 11 of
# the 28 rows below — every serving role and alias, but none of the embedder
# pool, worker_fast/worker_coder, eval_batch_frontdoor, orchestrator,
# document_formalizer, sd_server or whisper. Deriving 11 rows and declaring 17
# would split one table across two files, which is worse than one table plus a
# guard. `validate_declaration_parity()` asserts the 11 matched rows agree, so
# the half that IS doubly declared cannot drift.
port_map:
  worker: 8070
  frontdoor: 8070          # Full-speed 1×96t (halves: 8080, 8180 — quarters 8280/8380 retired 2026-07-30)
  # 2026-08-01 W1 CUTOVER: coder_escalation LEFT frontdoor's :8070 35B process.
  # It is now an alias on architect_general's :8083 MI210 27B dense Q8 — a
  # DIFFERENT model on a DIFFERENT device, so the coder chain is a real
  # escalation for the first time since the 2026-05-09 consolidation.
  # 2026-09-27 ARCHITECT SWAP (operator-decided): same :8083 process, whose host
  # label is now architect_critic (was architect_general).
  coder_escalation: 8083   # Alias -> architect_critic shared Qwen3.8-27B GPU server (host was architect_general until 2026-09-27; Qwen3.6-27B until 2026-08-20)
  worker_summarize: 8070   # Alias -> frontdoor shared Qwen3.6 server (its ONLY alias now)
  worker_general: 8070     # Alias -> frontdoor shared Qwen3.6-35B-A3B server (gemma4 retired 2026-09-22; halves 8080/8180)
  worker_explore: 8070     # Alias -> frontdoor (legacy name; pre-2026-03-19)
  worker_math: 8070        # Alias -> frontdoor, shares the 35B-A3B server
  toolrunner: 8070         # Alias -> frontdoor, shares the 35B-A3B server
  worker_vision: 8086      # Dedicated VL server — Qwen3-VL-30B-A3B Q4_K_M on MI210 (2026-08-01)
  vision_escalation: 8086  # Alias -> worker_vision, SAME process (was :8087 own 7B server)
  eval_batch_frontdoor: 18070  # Warm eval-batch Qwen3.6 frontdoor lane (-np 2)
  worker_coder: 8102       # Fast coding worker semantic role (1.5B backend) — DEPRECATED (worker_pool)
  worker_fast: 8102        # Fast worker (1.5B, WARM, 4 slots) — DEPRECATED (worker_pool)
  # Specialists (no pre-warm — already multi-instance or too large for quarters)
  # 2026-09-27 ARCHITECT SWAP (operator-decided): the labels swapped over
  # unchanged processes. architect_general = Qwen3.8-Flash-Next UD-IQ4_XS on the
  # full CPU instance (:8074, the terminal escalation rung); architect_critic =
  # Qwen3.8-27B Q8 on the MI210 (:8083), host of coder_escalation +
  # ingest_long_context.
  # History: 2026-08-01 W1 CUTOVER — architect_critic took the full CPU instance
  # the 122B UD-Q4_K_M vacated in architect_general; from the 2026-09-22 lineup
  # change it served Qwen3.8-Flash-Next on that instance (122B retired).
  # Port 8074 is deliberate: 8084 and 8071 belonged to the removed
  # architect_coding role and stack_change_guard.py L326/L346 reject them.
  architect_general: 8074
  architect_critic: 8083
  # architect_coding REMOVED 2026-05-06 — REAP-246B 70% coder < frontdoor 97%; role eliminated. 139 GB freed.
  ingest_long_context: 8083  # Alias -> architect_critic Qwen3.8-27B GPU server (host was architect_general until 2026-09-27; Next-80B retired 2026-09-22)
  # Embedding servers (6 parallel instances for redundancy)
  embedder: 8090           # Primary embedding server
  embedder_1: 8091
  embedder_2: 8092
  embedder_3: 8093
  embedder_4: 8094
  embedder_5: 8095
  embedder_granite_97m_r2: 8096
  embedder_multilingual_e5_base: 8097
  embedder_bge_m3: 8098
  orchestrator: 8000
  document_formalizer: 9001
  sd_server: 8190          # Qwen-Image-2.1 compatibility service (CPU-only Diffusers)
  whisper: 9000            # whisper.cpp STT (transcription service, not llama-server)
  tts: 9002                # qwentts.cpp TTS (registered 2026-08-02, W4)

# Stack-managed auxiliaries whose startup failure is non-fatal but must remain
# visible in the read-only status surface even when no state row was created.
# Loaded as a frozenset.
optional_auxiliary_roles:
  - whisper
  - tts

# HOT roles (always started) - NUMA-optimized
# 2026-05-06: architect_coding removed, ingest_long_context promoted (see registry).
# DERIVABLE (phase 2): the master registry's process_layout.hot_resident says the
# same thing, and validate_against_registry() already cross-checks the two.
hot_roles:
  - frontdoor
  - coder_escalation
  - worker_general
  - embedder
  - architect_general  # 2026-09-27 swap: now the :8074 Flash-Next process, which D1 keeps hot
  - architect_critic   # 2026-08-01 W1: tier hot per OPERATOR DECISION D1 ("keep it hot"); the :8083 27B since the 2026-09-27 swap
  - ingest_long_context
  # worker_vision / vision_escalation REMOVED STACKCHG-DFLASH2-20261003: :8086 is a COLD (warm-tier) CPU
  # role while the MI210 carries DFlash2. Keeping them here would make the /health fallback
  # probes report a deliberately-stopped server as down.

# Roles that must never run concurrently (large/latency-sensitive paths).
#
# 2026-08-02 PHASE 2 — THIS IS AN ADMISSION POLICY, NOT A SERVER SHAPE.
# It answers "how many requests will the orchestrator have in flight for this
# role" (src/api/admission.py), NOT "how many slots is the server launched
# with". Those are different questions and a role may legitimately run a 2-slot
# server while admission serialises it. The launcher no longer derives `-np`
# from this set: `-np` comes from the DECLARED `server_mode.<role>.slots` in the
# master registry (see `launch_shape.fallback_slots` below for what happens when
# master declares nothing). Do not re-couple them — the coupling is how a
# `slots: 1` declaration ended up launching `-np 2`.
#
# 2026-05-06: removed architect_coding (role eliminated) + thinking_reasoning (role eliminated, no GGUF).
#
# 2026-08-01 W1 CUTOVER — this set is aligned to the PROCESS, not the role
# name, so two aliases on one server disagreeing about serialization is
# incoherent by construction.
#   - coder_escalation REMOVED: it is now an alias on architect_general's :8083
#     GPU process, which declares slots: 2 and is NOT serial. It was serial only
#     because it used to share frontdoor's single-slot CPU 35B.
#   - worker_vision ADDED: it and vision_escalation are now ONE :8086 process
#     declaring slots: 1. Serializing one alias but not the other served no one.
#   - architect_critic ADDED: one full 0-95 instance that holds all four CPU
#     region locks while it runs. Concurrency here serializes the whole machine.
#
# 2026-09-27 ARCHITECT SWAP (operator-decided): the full 0-95 Flash-Next process
# (:8074) now serves architect_general, so it is architect_general that is serial
# (aligned to the PROCESS). architect_critic is now the :8083 27B GPU process
# (slots: 2, not serial), host of coder_escalation.
serial_roles:
  - worker_summarize
  - architect_general
  - worker_vision
  # 2026-05-11: frontdoor added to test -np 1 vs -np 2 single-instance throughput.
  # -np 2 was inherited from quarter-mode (4×48t) where two slots gave round-robin
  # admission. In full-mode 1×96t single-user serving, slot 2 is just preallocated
  # KV that we never use — wastes L3. If -np 1 measurably improves throughput,
  # keep frontdoor in SERIAL_ROLES; otherwise revert.
  - frontdoor
  # architect_general REMOVED 2026-05-09: -np 1 + speculative tree decode
  # (draft_max=24, p_split=0) trips a llama.cpp assertion in
  # common_speculative_state_tree::draft — `init: ... starting position of Y < cache position X`
  # → `decode: failed to initialize batch` →
  # `init: invalid seq_id[1][0] = 1 >= 1` →
  # `GGML_ASSERT(logits != nullptr)` in common/sampling.cpp:152.
  # Build b8957-2ffbdbbba (production llama.cpp). Re-enable when upstream patches
  # M-RoPE rollback or we move to a binary that supports it. Throughput cost: spec
  # decode previously +25% (4.3→12.6 t/s with moe8+spec_q8); MoE-expert-reduction
  # path stays active so we keep the moe-budget gain (12.19 t/s probe-B canonical).
  - ingest_long_context
  - vision_escalation
  - formalizer
  - toolrunner


# =============================================================================
# Single source of truth for "which roles run where" (refactored 2026-05-06)
# =============================================================================
# Pre-2026-05-06: HOT_SERVERS + WARM_SERVERS were two parallel hand-edited lists
# of dicts that duplicated wiring data already in NUMA_CONFIG. This made it easy
# to forget one when adding/removing/renaming a role and ship a broken config.
#
# Post-2026-05-06: HOT_SERVERS / WARM_SERVERS are COMPUTED from:
#   1. role_launch_meta (below) — small classification dict: per-role tier +
#      launch mode + aliases + mode-specific kwargs.
#   2. numa_config (orchestration/stack_topology.yaml) — wiring spec: per-role
#      NUMA instances list.
#
# Adding a new role now requires editing TWO places consistently:
#   a) Add the role's NUMA wiring in stack_topology.yaml numa_config (or set
#      `no_numa: true` here if the role takes no numa_config wiring, e.g.
#      worker_fast; the embedder pool is no_numa but pinned per port by
#      `embedding.placement`).
#   b) Add a role_launch_meta entry with tier/mode/aliases.
# A consistency check (`_validate_role_classification()` in stack_manifest.py)
# catches common mismatches at module load time.
#
# ORDER IS LOAD-BEARING. HOT_SERVERS / WARM_SERVERS are emitted in this order.
#
# PHASE 2 — `shared_with_first_n` IS NO LONGER DECLARED HERE. It is DERIVED, per
# role, from `server_mode.<role>.shared_with` in the master registry:
#
#     shared_with_first_n = launcher_only_aliases + master shared_with
#
# `launcher_only_aliases` (below, on worker_general only) carries alias names the
# launcher must attach that master does not list. Extras lead so the historical
# roles-list order is preserved byte-for-byte. `shared_with_first_n_count` stays
# declared here: it says which INSTANCES get the aliases, which is a launcher
# concept master has no way to express.
#
# `tier` stays declared here (option b): master covers 6 of these 17 rows —
# the embedder pool, worker_fast and eval_batch_frontdoor have no server_mode
# row at all. The parity guard asserts the 6 matched rows agree.
role_launch_meta:
  # worker_general and ingest_long_context role_launch_meta entries REMOVED
  # 2026-09-22 (lineup change): both became ALIASES and no longer launch a
  # server of their own. Every other alias -- coder_escalation,
  # worker_summarize, vision_escalation, worker_explore, toolrunner,
  # worker_math -- is likewise absent here, so this follows the convention
  # rather than adding a no_numa flag to a role that has no launch to flag.
  # ---- HOT tier (always started) ----
  # 2026-05-09: coder_escalation + worker_summarize CONSOLIDATED onto frontdoor's
  # llama-server. All three share the same Qwen3.6-35B-A3B Q8 GGUF since the
  # 2026-05-06 model swap; running them as separate processes wasted 36 GB of
  # mlocked RAM and ran two competing 96-thread OMP teams (-40% to -69%
  # throughput on the cohabiting roles per 2026-05-09 measurements). The
  # orchestrator API routes by role name → registry's url field (all three
  # roles point at port 8070 in the registry).
  frontdoor:
    tier: hot
    mode: default
  # 2026-09-27 ARCHITECT SWAP (operator-decided): the two architect launch rows
  # swapped labels over unchanged processes.
  # architect_general — the full CPU instance, port 8074, tier hot per OPERATOR D1.
  # Qwen3.8-Flash-Next UD-IQ4_XS (served as architect_critic 2026-09-22 → 2026-09-27;
  # the 122B UD-Q4_K_M as architect_critic from 2026-08-01, and as architect_general
  # on this instance before that).
  architect_general:
    tier: hot
    mode: default
  # architect_critic — a dense 27B Q8 on MI210 (ROCm0), port 8083, HOSTS
  # coder_escalation and ingest_long_context as aliases on its :8083 process.
  # Model: Qwen3.6-27B from 2026-08-01, Qwen3.8-27B-Q8_0 since 2026-08-20; served
  # as architect_general until the 2026-09-27 swap.
  architect_critic:
    tier: hot
    mode: default
    # aliases DERIVED: server_mode.architect_critic.shared_with -> [coder_escalation, ingest_long_context]
  # 2026-08-01 W1 CUTOVER: one MI210 vision process serving BOTH role names.
  # vision_escalation lost its own entry — it no longer launches anything.
  worker_vision:
    tier: warm   # STACKCHG-DFLASH2-20261003: CPU, cold — `start` skips it; start --only/--include-warm worker_vision
    mode: vision
    vision_type: worker
    # aliases DERIVED: server_mode.worker_vision.shared_with -> [vision_escalation]
  # Embedders — not in numa_config (no region locks, no contention-matrix
  # cells), fixed single port each. `no_numa` means exactly that and no more:
  # they ARE pinned, by the per-port `embedding.placement` cpusets below, not
  # by stack_topology.yaml (UFH-12 Phase 0, 2026-09-26).
  embedder:   {tier: hot, mode: embedding, no_numa: true, port: 8090}
  embedder_1: {tier: hot, mode: embedding, no_numa: true, port: 8091}
  embedder_2: {tier: hot, mode: embedding, no_numa: true, port: 8092}
  embedder_3: {tier: hot, mode: embedding, no_numa: true, port: 8093}
  embedder_4: {tier: hot, mode: embedding, no_numa: true, port: 8094}
  embedder_5: {tier: hot, mode: embedding, no_numa: true, port: 8095}
  # Dense-retriever Phase B candidates. Warm/default-off so production
  # BGE-large episodic memory behavior stays unchanged until explicitly launched.
  embedder_granite_97m_r2:
    tier: warm
    mode: embedding
    no_numa: true
    port: 8096
  embedder_multilingual_e5_base:
    tier: warm
    mode: embedding
    no_numa: true
    port: 8097
  embedder_bge_m3:
    tier: warm
    mode: embedding
    no_numa: true
    port: 8098
  # ---- WARM tier (optional, --include-warm) ----
  # 2026-05-06: worker_pool deprecated in registry; warm 1.5B worker retained as inert.
  worker_fast:
    tier: warm
    mode: worker_pool
    worker_type: fast
    no_numa: true
    port: 8102
  # P-BENCH-3/A7: explicit-only batch-serving lane for EvalTower traffic.
  # launcher_only keeps this warm process out of lean-registry and descriptor
  # compile inputs; it is not a distinct model-routing role.
  eval_batch_frontdoor:
    tier: warm
    mode: eval_batch_frontdoor
    launcher_only: true
  # architect_coding REMOVED 2026-05-06 (REAP-246B role eliminated; 139 GB freed)
  # ingest_long_context PROMOTED to HOT 2026-05-06 (Stage 1 of three_stage_summarization)
  # thinking_reasoning REMOVED 2026-05-06 (GGUF deleted from disk 2026-03-06)


# =============================================================================
# Model paths
# =============================================================================
# DERIVABLE (phase 2): the master registry declares a `path` (or model_id +
# descriptor binding) for every serving role. These are second copies.
models:
  # Embedding model: BGE-large-en-v1.5 (purpose-built for embeddings, 1024 dims)
  # 6 parallel instances provide redundancy and reduce latency via fan-out
  embedding_model_path: "{models_dir}/bge-large-en-v1.5-f16.gguf"

  # Worker pool models (FIXED paths to existing files)
  # NOTE: worker_coder uses the fast 1.5B worker backend on port 8102.
  worker_pool:
    # gemma4-26B-A4B Q4_K_M MTP — swapped 2026-05-08 from Qwen3-Coder-30B-A3B Q4_K_M.
    # +18pp on tool_compliance (96% vs 78%), +6pp on full suite (90% vs 84%),
    # +36% tps on tool_compliance (60.7 vs 44.7), 3× more concise output.
    # NB: requires ik_llama.cpp PR #1744 binary (Phase 2 wires runtime_requirements
    # through the launcher; until then this path is informational only — production
    # launcher still uses default LLAMA_SERVER and will fail on gemma4 arch).
    # 2026-06-26 v6 cutover: ORIG base GGUF — old gemma-4-26B-A4B-it-Q4_K_M.gguf garbles on v6.
      # 2026-09-23: the gemma4 path this named was DELETED with the model.
      # worker_explore is now an ALIAS on frontdoor's Qwen3.6-35B-A3B-MTP process
      # (server_mode.frontdoor.shared_with), so this pool entry selects nothing at
      # launch today -- but it named an ABSENT file, which is exactly the shape that
      # makes a launcher surface lie. Repointed at the artifact the lane actually
      # resolves to, so the entry stays valid if the pool path is reactivated.
    explore: /mnt/raid0/llm/models/Qwen3.6-35B-A3B-MTP-Q8_0.gguf
    fast: "{model_base}/QuantFactory/Qwen2.5-Coder-1.5B-GGUF/Qwen2.5-Coder-1.5B.Q4_K_M.gguf"

  # Draft model for MTP speculative decoding on explore worker.
  # gemma4 assistant Q8 — in-house GGUF converted from google/gemma-4-26B-A4B-it-assistant
  # safetensors (no community GGUF existed). 4-layer drafter, 58% acceptance at draft_max=2.
  # 2026-06-26 v6 cutover: v6 MTP head — old -assistant-Q8_0.gguf is the ik gemma4_mtp format, incompatible with v6.
  # 2026-09-23: the gemma4 v6 MTP head was DELETED with the model. The explore lane
  # now resolves to frontdoor's Qwen3.6-35B-A3B-MTP artifact, whose MTP head is FUSED
  # into the same GGUF (mtp_capable: true) rather than living in a separate drafter
  # file, so there is no external draft model to name here any more.
  explore_draft_model: null

  # Dev-mode tiny model (orchestrator_stack --dev)
  dev_model: Qwen2.5-Coder-0.5B-Instruct-Q8_0.gguf


# Embedding server fleet.
# EMBEDDER_PORTS + EMBEDDING_SERVER_RECIPES are built from this block: every
# pool port gets the same recipe (with models.embedding_model_path injected as
# model_path), then the per-port recipes below are merged on top.
embedding:
  pool_ports: [8090, 8091, 8092, 8093, 8094, 8095]
  pool_recipe:
    model_name: BGE-large-en-v1.5 (embeddings)
    # 2026-09-26 UFH-12 Phase 0 (REPL-EMB-0.1): 512 -> 2048. With -np 4 the
    # per-slot context was 512/4 = 256 tokens, half of BGE-large's 512-token
    # training window, and every launch logged the n_ctx_seq WARN
    # (wiki/kv-cache.md "Rollout candidates" #2). 2048/4 = 512 per slot = the
    # model's window. BGE is an encoder with no KV cache, so an input that
    # already fit is expected to embed identically (proof P6 in the package
    # checks it); only 257-512-token inputs change, from a server error to an
    # embedding.
    context_tokens: 2048
    threads: 4
    slots: 4
    pooling: cls
    flash_attn: true
    # 2026-09-26 UFH-12 Phase 0: private weights so the per-instance membind
    # below is REAL. Under shared mmap the GGUF's pages sit wherever the first
    # instance (or the page cache) put them and a membind is accepted and
    # silently does nothing (stack_topology.yaml, the cross-role mmap note).
    # Cost: 6 x 0.62 GiB = 3.7 GiB private RAM, inside capacity.host_os_reserve_gib.
    no_mmap: true
  # ── 2026-09-26 UFH-12 Phase 0 — DECLARED PLACEMENT (REPL-EMB-0.1) ─────────
  # Until this block existed the pool had NO placement: `no_numa: true` plus an
  # empty spawn prefix, and the canonical OMP env (OMP_PROC_BIND=spread,
  # OMP_PLACES=cores) then bound all six servers' 4 compute threads to the SAME
  # four core places, 0/96 32/128 48/144 88/184 (read from /proc/<pid>/task/*/
  # status on 2026-09-26). Six servers delivered one server's compute, from
  # inside frontdoor's 0-95.
  #
  # One cpuset per port, honoured EXACTLY: the launcher wraps the spawn in
  # `numactl --membind=<node> -- taskset -c <cpuset>`, where <node> is the one
  # NPS4 node the cpuset lies in (derived, never declared). The bench guard may
  # REFUSE a declared cpuset; it may never re-pin it (same contract as the aux
  # services' `cpuset`). stack_manifest asserts at import that every pool port
  # is declared, the cpusets are pairwise disjoint, each lies in ONE NPS4 node,
  # `threads` equals the cpuset size, and none SMT-folds onto the speech
  # services' cpusets or the GPU host lane.
  #
  # WHY SMT SIBLINGS. No logical CPU on this host lacks a physical sibling in
  # 0-95 (kernel-verified 2026-09-07), so "free cores" do not exist; the choice
  # is only WHO pays. Siblings charge frontdoor/Flash-Next (:8074) only while an embedder
  # computes (KMP_BLOCKTIME=10 releases idle teams); carving physical cores out
  # of 0-95 would charge every decode forever and re-shape NUMA_FULL. The cost
  # is a MEASUREMENT GATE (G1 in the package), not an assumption.
  #   96-119  siblings of whisper 0-23  -> excluded (speech hangs on
  #   120-135 siblings of tts 24-39     -> excluded  unmeasured layouts)
  #   184-191 GPU host lane             -> excluded
  #
  # NEXT TO EACH SERVING MODEL (operator D1, 2026-09-26). The node is what the
  # scheduler's "instance sharing the requesting model's hardware" reads:
  #   node 1 (136-143) -> half A :8080 (nodes 0,1)
  #   node 2 (144-151) -> half B :8180 (nodes 2,3)
  #   node 3 (176-183) -> the GPU host lane 184-191 (:8083 27B, :8086 VL), and half B
  #   full :8070 / Flash-Next :8074 (architect_general since the 2026-09-27 swap)
  #   span all four nodes, so every instance is adjacent.
  placement:
    8090: {cpuset: "136-139"}   # node 1, siblings of 40-43
    8091: {cpuset: "140-143"}   # node 1, siblings of 44-47
    8092: {cpuset: "144-147"}   # node 2, siblings of 48-51
    8093: {cpuset: "148-151"}   # node 2, siblings of 52-55

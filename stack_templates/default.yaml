# DS-7: Default stack template — matches current stack_manifest.py launch topology.
# This is the production steady-state/static-prewarm baseline retained by the
# DS-E1 profile decision on 2026-07-04.
#
# System: 1×AMD EPYC 9655, 96 physical cores (192 threads), NPS4, 1130 GB RAM.
# Topology is DERIVED, not authored here — see the block above `roles:` below.
# (Read "2×AMD EPYC 9004, 192 cores (384 threads)" until 2026-08-11: wrong.)
#
# 2026-07-30/31 quarter retirement + 2026-08-01 W1 cutover, restated here from
# the compiled artifacts (see the `roles:` note below):
#   * CPU pre-warm roles (frontdoor, worker_general, ingest_long_context) run
#     1×96t FULL instance + 2×48t HALF instances. The four-quarter lineup
#     (8280/8380, 8282/8382, 8385/8485, 8187..8487) was RETIRED and its ports
#     freed — they must not be revived here.
#   * architect_critic and worker_vision are MI210 roles: the model is on the
#     GPU and only 8 HOST threads are pinned, on GPU_HOST_LANE (184-191).
#   * architect_general (:8074) is the whole-machine CPU process (the 122B that
#     vacated architect_general on 2026-08-01, Qwen3.8-Flash-Next since
#     2026-09-22); coder_escalation and ingest_long_context alias architect_critic,
#     and vision_escalation aliases worker_vision (all are the SAME server process
#     as their target, not a second instance).
#   * 2026-09-27 ARCHITECT SWAP (operator-decided): the two architect labels
#     swapped over unchanged processes — architect_general = Flash-Next CPU :8074,
#     architect_critic = 27B MI210 :8083.
#
# Embedding roles (embedder, embedder_1..5):
#   6×BGE single-port embedding servers, no NUMA pinning, optional at launch
#
# Aliases are represented with tier=ALIAS + alias_to; they do not launch separate servers.
# Single-instance roles: 1×96t full-machine, 1×8t GPU host lane, or embedding-mode dedicated

name: default
description: Production steady-state static-prewarm baseline (DS-E1 retained 2026-07-04) — current manifest topology with explicit aliases
version: "1"

metadata:
  ds7_profile: steady_state_static_prewarm
  ds7_decision:
    status: retain_default
    decided_at: "2026-07-04T19:40:20Z"
    evidence_packet: orchestration/reports/ds_e1_evidence_packet_20260704T192333Z.md
    evidence_packet_json: orchestration/reports/ds_e1_evidence_packet_20260704T192333Z.json
    rationale: DS-E1 packaged stack roster, DS-5 manifest freshness, contention matrix, RI-10 canary evidence, and production KV-size rows with no blockers; no evidence shows static pre-warm leaves a material throughput or latency gap.
    ds6_quarter_scheduler: parked_until_static_prewarm_gap
    validation_command: python3 scripts/server/orchestrator_stack.py start --stack-profile default --validate-only

# Fine-grained resource budget (NIB2-19 / DS-7 Gap 4). Omitting this block
# falls back to system defaults (744 / 930 / 100). System total is 1130 GB.
resource_budget:
  max_mlock_gb: 800    # HOT tier ceiling (production stack uses ~653 GB)
  max_total_gb: 930    # HOT + WARM combined ceiling
  reserve_kv_gb: 100   # minimum headroom for KV caches + OS

# ── TOPOLOGY IS DERIVED, NOT AUTHORED ────────────────────────────────────────
# The `port` / `numa` / `threads` values in every `full:` and `quarters:` block
# below are a RESTATEMENT of a fact this file does not own. The single source is
#
#     orchestration/stack_topology.yaml  `numa_config:`
#     (loaded as scripts.server.stack_numa.NUMA_CONFIG + NUMA_INSTANCE_SHAPES)
#
# and `numa:` names a shape from that file's `cpu_shape` with the `NUMA_` prefix
# dropped (`NUMA_HALF_A` -> `HALF_A`; `GPU_HOST_LANE` has no prefix).
#
# Do NOT hand-edit these blocks. Regenerate them from the source:
#
#     python3 scripts/validate/default_template_topology_parity.py --render
#
# and verify with the parity gate, which fails if this file and the source ever
# disagree on a port, a shape name or a thread count — including the `threads:`
# and `numa:` fields, which until 2026-08-11 no gate compared for any role but
# frontdoor and architect_general:
#
#     python3 scripts/validate/default_template_topology_parity.py
#     pytest tests/unit/test_default_template_topology_parity.py
#
# This template being a FOURTH copy of the topology is P1-4 of epyc-root
# handoffs/active/numa-topology-cutover-resume-20260730.md. The gate is what
# makes the copy safe until the derivation moves into `load_template` (that
# module's docstring carries the standing proposal for removing the copy).
# ─────────────────────────────────────────────────────────────────────────────
roles:
  # Per-role model/quant/ram_gb rows below are compared against
  # orchestration/derived/stack_priors.yaml by the stack-change guard rule
  # `stale_role_fact_table`. Restate them from the compiled artifact; do not
  # hand-maintain them.
  frontdoor:
    model: Qwen3.6-35B-A3B-MTP-Q8_0   # 2026-08-01: was Qwen3.6-35B-A3B-Q8_0 (the NON-MTP GGUF, a different file)
    quant: Q8_0
    tier: HOT
    ram_gb: 37
    full:
      port: 8070
      numa: FULL
      threads: 96
      slot_save_path: /tmp/kv_frontdoor_full
    quarters:
      - { port: 8080, numa: HALF_A, threads: 48 }
      - { port: 8180, numa: HALF_B, threads: 48 }

  coder_escalation:
    # 2026-08-01 W1: moved off frontdoor's 35B onto architect_general's :8083
    # 27B (registry: roles.coder_escalation.alias_of + server_mode
    # <host>.shared_with) — one process, two names.
    # 2026-09-27 ARCHITECT SWAP: same :8083 process, host label now architect_critic.
    tier: ALIAS
    alias_to: architect_critic

  worker_summarize:
    tier: ALIAS
    alias_to: frontdoor

  worker_general:
    # 2026-09-22 lineup change: gemma-4-26B-A4B-it retired. This role no longer launches
    # a server of its own -- it joined frontdoor's Qwen3.6-35B-A3B-MTP-Q8_0 process via
    # server_mode.frontdoor.shared_with, so :8072/:8082/:8182 are vacated and its context
    # and slots come from frontdoor. Same shape worker_summarize has had.
    tier: ALIAS
    alias_to: frontdoor
  worker_explore:
    tier: ALIAS
    alias_to: frontdoor   # 2026-09-22: was worker_general, itself now an alias
  worker_math:
    tier: ALIAS
    alias_to: frontdoor   # 2026-09-22: was worker_general, itself now an alias
  toolrunner:
    tier: ALIAS
    alias_to: frontdoor   # 2026-09-22: was worker_general, itself now an alias
  architect_general:
    # 2026-09-27 ARCHITECT SWAP (operator-decided): this is the whole-machine CPU
    # process on :8074 (was architect_critic 2026-08-01 → 2026-09-27; the 122B that
    # used to sit on architect_general before that). Terminal rung of the
    # escalation ladder.
    model: Qwen3.8-Flash-Next-UD-IQ4_XS   # 2026-09-22: was Qwen3.5-122B-A10B (retired)
    quant: UD-IQ4_XS
    tier: HOT
    ram_gb: 69
    full:
      port: 8074
      numa: FULL
      threads: 96

  architect_critic:
    # 2026-09-27 ARCHITECT SWAP (operator-decided): this is the 27B MI210 process on
    # :8083 (architect_general 2026-07-31/08-01 → 2026-09-27), host of the
    # coder_escalation and ingest_long_context aliases.
    model: Qwen3.8-27B-Q8_0
    quant: Q8_0
    tier: HOT
    ram_gb: 27.05
    full:
      port: 8083
      numa: GPU_HOST_LANE
      threads: 8
      spec_overrides:
        # 2026-08-20: was 24, which SILENTLY OVERRODE the registry's measured optimum (4 for
        # Qwen3.6-27B) — a spec_override here wins at stack-assembly time, so the stack was
        # drafting at 24 against a measured-4 artifact. Now 8 = the measured optimum for
        # Qwen3.8-27B (sweep: n6 55.22 / n8 55.46 / n12 51.14 t/s; curve turns over past 8).
        # Keep in step with speculative_decoding_policy.draft_max in the MASTER registry.
        # 2026-09-24: 8 -> 4 with the master (production shape np 4 + unified KV; depth 4 is
        # equal-or-faster there: np_context_kvu_study_20260924/q38_27b_q8_depth).
        draft_max: 4
        p_split: 0

  ingest_long_context:
    # 2026-09-22 lineup change: Qwen3-Next-80B-A3B retired. The role moved onto
    # architect_general's Qwen3.8-27B GPU server at :8083 (n_ctx 196608), so it no longer
    # launches its own CPU server and :8085/:8185/:8285 are vacated.
    # 2026-09-27 ARCHITECT SWAP: same :8083 process, host label now architect_critic.
    tier: ALIAS
    alias_to: architect_critic
  worker_vision:
    # 2026-07-31: Qwen2.5-VL-7B retired on both vision roles (MMMU-250 52.4% ->
    # 63.6%). Was Qwen2.5-VL-7B / 4.4 GB.
    model: Qwen3-VL-30B-A3B-Instruct
    quant: Q4_K_M
    tier: HOT
    ram_gb: 17.3
    full:
      port: 8086
      numa: GPU_HOST_LANE
      threads: 8

  vision_escalation:
    # 2026-08-01 W1 vision unification: the standalone :8087 instance was
    # retired; the escalation tier rides worker_vision's :8086 MI210 process.
    tier: ALIAS
    alias_to: worker_vision


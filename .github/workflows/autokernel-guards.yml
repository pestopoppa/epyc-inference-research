name: autokernel guards

# The AutoKernel package took 271,216 insertions against 92 deletions in five weeks
# and reached 6.2x the size of the CUDA/HIP backend it exists to optimise, with 68% of
# its source never executing. Nothing bounded it and nothing ran on a push.
#
# This workflow is the bound. It runs the fast, hardware-free tests and the regrowth
# guards; it does NOT run the GPU or build suites, which need an MI210 and a ROCm
# toolchain no runner has.

on:
  push:
    paths:
      - 'scripts/kernel_rnd/autokernel/**'
      - 'scripts/benchmark/run_autokernel_gpu_discovery.py'
      - 'scripts/benchmark/autokernel_*.py'
      - '.github/workflows/autokernel-guards.yml'
  pull_request:
    paths:
      - 'scripts/kernel_rnd/autokernel/**'
      - 'scripts/benchmark/run_autokernel_gpu_discovery.py'
      - 'scripts/benchmark/autokernel_*.py'

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # actions/setup-python ships a bare interpreter -- pytest is NOT preinstalled.
      # Without this step the test step died on "No module named pytest" before it
      # collected anything, which is how this workflow went 41 consecutive runs, from
      # its first commit onward, without ever executing a single assertion. A step that
      # cannot start is not a passing guard and is not a failing test; it is no guard
      # at all, and it hid two real test regressions for two days.
      - name: Install the test runner
        run: python3 -m pip install --disable-pip-version-check pytest

      # Fail loudly and specifically if the runner is still not importable, rather than
      # letting a future dependency change reproduce the same silent two-day hole.
      - name: Prove the test runner is importable
        run: python3 -m pytest --version

      # Installing pytest closes the hole this workflow fell into. It does not close the
      # SHAPE of it: a suite that runs FEWER assertions than it used to reports exactly
      # the same green as one that runs all of them. pytest refuses the TOTAL collapse
      # on its own -- collecting nothing exits 5 -- but a rename, a moved package or a
      # narrowed path that drops 178 of 196 tests passes silently. The counts are
      # declared as floors so that losing coverage requires editing a number and saying
      # why in the commit, the same way LOOP_LOC_BUDGET works.
      - name: Prove the suites did not silently shrink
        run: python3 scripts/kernel_rnd/autokernel/check_suite_floors.py

      - name: Regrowth guards
        run: python3 scripts/kernel_rnd/autokernel/check_regrowth_guards.py

      - name: The decision arithmetic
        # Deliberately a NAMED list, not the whole tree. These are the modules where
        # a defect changes what the loop concludes: the estimator that decides
        # faster-or-not, the workload contract that decides whether a measurement is
        # about production at all, the gate-parameter diff that makes a moving
        # threshold visible, the build recipe that refuses an unexplained divergence,
        # the experiment memory, and the guards themselves.
        #
        # -rs prints the REASON for every skip. Two tests in test_workload_contract.py
        # assert against the real GGUF files under /mnt/raid0 and skip on a runner,
        # where those files do not exist; the real-artifact tests in
        # test_anchor_integrity.py likewise skip when the staged R21-10 deterministic
        # build pair (/mnt/raid0/llm/tmp/r2110-build-{a,b}) is absent. That is
        # legitimate -- but it must be legible in the log, not an invisible
        # subtraction from the pass count. A guard that silently no-ops is worse
        # than one that is red.
        run: |
          python3 -m pytest -q -rs \
            scripts/benchmark/test_screen_effect_estimator.py \
            scripts/benchmark/test_autokernel_funsafe_math_admission.py \
            scripts/kernel_rnd/autokernel/controller/test_anchor_integrity.py \
            scripts/kernel_rnd/autokernel/controller/test_workload_contract.py \
            scripts/kernel_rnd/autokernel/controller/test_build_recipe.py \
            scripts/kernel_rnd/autokernel/controller/test_gate_parameters.py \
            scripts/kernel_rnd/autokernel/controller/test_experiments.py \
            scripts/kernel_rnd/autokernel/controller/test_gpu_utilization.py \
            scripts/kernel_rnd/autokernel/controller/test_kernel_hotspots.py \
            scripts/kernel_rnd/autokernel/test_check_regrowth_guards.py \
            scripts/kernel_rnd/autokernel/test_check_suite_floors.py

      - name: The loop package
        # The rebuilt loop is the package every path filter above triggers on, and it
        # was the one thing this workflow never ran. It is entirely hardware-free:
        # 196 tests, no GPU, no ROCm, no /mnt/raid0, no API key. The modules do name
        # absolute host paths (residency.py globs /sys, pool.py names /mnt/raid0), but
        # those are module constants -- a missing path globs empty at import and the
        # tests drive the logic through temporary directories, so the suite is
        # identical on this host and on a runner. Verified by running it from a clean
        # `git archive` checkout: 196 passed in both.
        # -rs for the same reason as above: any skip must state why. This suite is
        # expected to skip NOTHING; if a skip ever appears here, the loop package has
        # grown a hardware dependency and the log will name it.
        run: python3 -m pytest -q -rs scripts/kernel_rnd/autokernel/loop/

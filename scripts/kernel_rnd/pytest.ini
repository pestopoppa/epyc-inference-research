# Anchors pytest's rootdir (and so its conftest cut-off) at scripts/kernel_rnd.
# Without it, `pytest test_x.py` run from inside autokernel/loop makes loop/ the
# rootdir, and pytest never loads kernel_rnd/conftest.py or autokernel/conftest.py.
# The loop tests then lose their hermetic fixtures (host-claim isolation, the
# permissive store guard, the census journal) and fail for reasons that have
# nothing to do with the code under test.
[pytest]
